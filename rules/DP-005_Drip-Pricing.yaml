- id: DP-005
  name_de: "Versteckte Kosten und nachträgliche Preiserhöhung im Bestellvorgang"

  kategorie: "Irrefuehrung"

  status: REVIEW
  bearbeiter: "Jura-Team"

  applies_when:
    all:
      - "is_b2c_offer == true"      # umbenannt 20.08., Korb B
      - "has_price_display == true"
      - "has_checkout_flow == true"
    none:
      - "is_financial_services == true"

  legal_basis:
    - "§ 3 PAngV – Pflicht zur Angabe des Gesamtpreises"
    - "§ 6 PAngV – Preisangaben bei Fernabsatzverträgen"
    - "§ 312j Abs. 2 BGB – Informationen unmittelbar vor Abgabe der Bestellung"
    - "§ 5 UWG – Irreführende geschäftliche Handlungen"
    - "§ 5a UWG – Irreführung durch Unterlassen"
    - "§ 5b Abs. 1 Nr. 3 UWG – Gesamtpreis und zusätzliche Kosten als wesentliche Information"
    - "Anhang zu § 3 Abs. 3 UWG Nr. 20 – unzutreffende Bewerbung als 'gratis'"
    - "§ 3a UWG – Rechtsbruch"
    - "§ 8 Abs. 1, Abs. 3 Nr. 3 UWG – Beseitigung und Unterlassung durch qualifizierte Verbraucherverbände"

  tatbestand_de: >
    Unternehmer, die Verbrauchern Waren oder Leistungen unter Angabe eines
    Preises anbieten, müssen grundsätzlich den Gesamtpreis angeben. Der
    Gesamtpreis umfasst die Umsatzsteuer und sonstige Preisbestandteile.
    Bei Fernabsatzverträgen sind zusätzlich insbesondere anzugeben, ob
    Fracht-, Liefer-, Versand- oder sonstige Kosten anfallen und, soweit
    diese vernünftigerweise im Voraus berechnet werden können, deren Höhe.

    Im elektronischen Geschäftsverkehr mit Verbrauchern, der den Verbraucher
    zur Zahlung verpflichtet, müssen die gesetzlich bestimmten Informationen
    unmittelbar vor Abgabe der Bestellung klar und verständlich in
    hervorgehobener Weise zur Verfügung stehen.

    Eine nachträgliche Erhöhung des im bisherigen Bestellverlauf dargestellten
    Preises stellt nicht allein deshalb einen Rechtsverstoß dar, weil sich der
    Preis erhöht. Entscheidend ist vielmehr, ob ein verpflichtender
    Preisbestandteil bereits nach den einschlägigen Vorschriften hätte
    angegeben werden müssen und ob dieser rechtzeitig, klar und verständlich
    offengelegt wurde.

    Ein versteckter oder erst spät offengelegter obligatorischer Kostenbestandteil
    kann insbesondere gegen die Pflicht zur Angabe des Gesamtpreises sowie
    gegen die Pflicht zur rechtzeitigen Bereitstellung wesentlicher
    Informationen verstoßen.

    Bei einer Werbung oder Angebotsgestaltung mit "gratis", "kostenlos",
    "umsonst" oder einer entsprechenden Aussage ist zusätzlich zu prüfen,
    ob gleichwohl Kosten anfallen. Eine solche Bewerbung ist nach Anhang
    Nr. 20 zu § 3 Abs. 3 UWG grundsätzlich stets unzulässig, soweit es sich
    nicht um dort ausgenommene unvermeidbare Kosten im Zusammenhang mit dem
    Eingehen auf das Angebot oder der Abholung bzw. Lieferung handelt.

  anspruchskette: >
    Ein Verstoß gegen die PAngV kann als Verstoß gegen eine gesetzliche
    Vorschrift, die das Marktverhalten im Interesse der Marktteilnehmer
    regelt, einen Rechtsbruch nach § 3a UWG darstellen, sofern die weiteren
    Voraussetzungen des § 3a UWG, insbesondere die Eignung zur spürbaren
    Beeinträchtigung der Interessen von Verbrauchern, erfüllt sind.

    Daneben können eine irreführende Preisangabe nach § 5 UWG oder das
    Vorenthalten bzw. die nicht rechtzeitige Bereitstellung einer wesentlichen
    Preisinformation nach § 5a UWG vorliegen. Welche Norm im Einzelfall
    einschlägig ist, hängt davon ab, ob der Unternehmer eine unrichtige oder
    täuschende Preisangabe macht oder eine zutreffende, aber wesentliche
    Information nicht, nicht klar oder nicht rechtzeitig mitteilt.

    § 5b Abs. 1 Nr. 3 UWG konkretisiert für eine Aufforderung zum Kauf,
    welche Preisangaben grundsätzlich als wesentlich gelten. Dazu gehören
    insbesondere der Gesamtpreis sowie gegebenenfalls zusätzliche Fracht-,
    Liefer- und Zustellkosten bzw. die Tatsache, dass solche Kosten anfallen
    können.

    Liegt ein Rechtsbruch nach § 3a UWG vor, können nach § 8 Abs. 1 UWG
    insbesondere Beseitigungs- und Unterlassungsansprüche bestehen. Diese
    können nach § 8 Abs. 3 Nr. 3 UWG auch von qualifizierten
    Verbraucherverbänden geltend gemacht werden.

  signals:
    # ACHTUNG: Einige der folgenden Namen stehen noch nicht in _SIGNALE.md.
    # Welche davon zugesagt, ersetzt oder gestrichen werden, klaert
    # docs/ABSTIMMUNG_Regelwerk.md. Bis dahin nicht lauffaehig.

    # Angebot / Preis
    - "is_consumer_offer"
    - "has_price_display"
    - "listed_total_price"
    - "listed_price_components"

    # Checkout
    - "has_checkout_flow"
    - "price_at_checkout"
    - "price_immediately_before_order"
    - "mandatory_total_price_at_checkout"
    - "optional_costs_at_checkout"

    # Preisentwicklung im konkreten Bestellvorgang
    - "price_delta"
    - "mandatory_price_delta"
    - "optional_price_delta"
    - "price_delta_ratio"

    # Kostenarten
    - "shipping_cost_amount"
    - "shipping_cost_disclosed"
    - "shipping_cost_disclosed_before_checkout"
    - "additional_mandatory_cost_count"
    - "additional_mandatory_cost_amount"
    - "additional_mandatory_cost_disclosed"
    - "additional_mandatory_cost_disclosed_before_order"

    # Zusatzleistungen / Vorauswahl
    - "preselected_paid_addon_count"
    - "preselected_paid_addon_amount"
    - "paid_addon_disclosed_before_selection"

    # "Gratis"-Werbung
    - "gratis_claim_present"
    - "gratis_claim_scope"
    - "costs_present_despite_gratis_claim"
    - "costs_are_unavoidable_delivery_or_offer_costs"

    # Zeitpunkt / Evidenz
    - "first_price_display_timestamp"
    - "additional_cost_first_display_timestamp"
    - "price_history_within_current_journey"

    # In verdict_rules verwendet, hier bisher nicht deklariert:
    - "required_total_price_can_be_calculated"
    - "shipping_cost_can_be_calculated_in_advance"
    - "additional_mandatory_cost_first_display_after_product_page"

  # VOLLSTAENDIG UEBERARBEITET 20.08. nach dem Befundstufen-Massstab.
  # Ausgangslage: neun Bedingungen, von denen genau EINE ueberhaupt lauffaehig
  # war - alle uebrigen stuetzten sich auf Signale aus DP-005b (Navigation bis
  # zur Kasse), auf Namen, die _SIGNALE.md ausdruecklich als Rechtsbegriff
  # abgelehnt hat, oder auf einen umbenannten Namen. Und die eine lauffaehige
  # loeste auf praktisch jedem deutschen Shop aus.
  listen:
    # Formulierungen, bei denen sich das Gratis-Versprechen erkennbar NICHT
    # auf die Ware bezieht, fuer die die Versandkosten anfallen. Anhang Nr. 20
    # setzt voraus, dass die Kosten "fuer die Ware" anfallen.
    gratis_ohne_warenbezug:
      - "Gratis Versand ab"
      - "Versandkostenfrei ab"
      - "Gratis Rücksendung"
      - "Kostenlose Rücksendung"
      - "Kostenlose Retoure"
      - "Gratis Abholung"
      - "Gratis Zugabe"
      - "Gratis Probe"

  verdict_rules:

    eindeutig:
      # KEINE. Nach T1 bis T3 traegt derzeit keine Bedingung dieser Regel die
      # staerkste Stufe:
      #   - der Gesamtpreis-Zweig braucht "required_total_price_can_be_
      #     calculated", von _SIGNALE.md als Rechtsbegriff abgelehnt (T1);
      #   - die Zusatzkosten-Zweige beruhen auf DP-005b-Signalen, die erst
      #     entstehen, wenn die Bestelluebersicht erreicht wurde - ein "false"
      #     bedeutet sonst "wir sind nicht so weit gekommen" (T3);
      #   - der Gratis-Zweig steht unter der Ausnahme des zweiten Halbsatzes
      #     von Anhang Nr. 20 (T2).

    verdaechtig:
      # --- DP-005a: laeuft heute, ohne Navigation bis zur Kasse ----------
      # Von der Verbraucherzentrale im Seminar vom 19.08. ausdruecklich
      # genannt; vat_disclosure_present wurde deswegen auf ✅ hochgestuft.
      # Bis zum 20.08. nutzte keine Bedingung das Signal.
      - condition: "has_price_display == true and vat_disclosure_present == false"
        reason: >
          Im Preisumfeld fehlt ein Hinweis auf die Umsatzsteuer. Nach
          § 6 Abs. 1 Nr. 1 PAngV ist bei Angeboten gegenüber Verbrauchern
          anzugeben, dass die geforderten Preise die Umsatzsteuer und
          sonstige Preisbestandteile enthalten. Ob im Einzelfall eine
          Ausnahme greift, ist zu prüfen.

      # Gratis-Versprechen trotz Versandkosten. ENGER GEFASST 20.08.:
      # Anhang Nr. 20 nimmt Kosten aus, die fuer die Abholung oder Lieferung
      # unvermeidbar sind. Wird eine kostenlose Abholung angeboten, sind sie
      # gerade vermeidbar - dann greift die Ausnahme nicht. Und bezieht sich
      # das Versprechen erkennbar auf etwas anderes als die Ware ("Gratis
      # Rücksendung", "Versandkostenfrei ab 50 €"), fehlt schon der
      # Warenbezug. Ohne diese beiden Einschraenkungen loeste die Bedingung
      # bei allen fuenf Vergleichsseiten aus.
      - condition: >
          gratis_claim_present == true and
          shipping_cost_amount > 0 and
          free_pickup_option_present == false and
          gratis_claim_scope not in gratis_ohne_warenbezug
        reason: >
          Die Seite bewirbt ein Angebot als gratis, kostenlos oder umsonst,
          obwohl auf der Produktseite Versandkosten ausgewiesen sind, und
          eine kostenlose Abholung wird nicht angeboten. Nach Anhang Nr. 20
          zu § 3 Abs. 3 UWG ist eine solche Bewerbung stets unzulässig —
          ausgenommen sind jedoch Kosten, die für die Abholung oder Lieferung
          der Ware unvermeidbar sind. Ob sich das Gratis-Versprechen auf
          dieselbe Ware bezieht, für die die Kosten anfallen, ist zu prüfen.

      # Vorausgewaehlte kostenpflichtige Zusatzleistung.
      - condition: "preselected_paid_addon_count > 0 and paid_addon_disclosed_before_selection == false"
        reason: >
          Im Bestellvorgang war eine kostenpflichtige Zusatzleistung
          vorausgewählt, ohne dass vor der Auswahl auf sie hingewiesen wurde.
          Für Zusatzentgelte verlangt § 312a Abs. 3 BGB eine ausdrückliche
          Vereinbarung; eine Voreinstellung genügt dafür nicht.

      # --- DP-005b: AUSKOMMENTIERT bis die Signale existieren ------------
      # Zunaechst am 20.08. von "eindeutig" auf "verdaechtig" gestuft (T3:
      # ein "false" bei "..._disclosed_before_order" bedeutet nur dann "nicht
      # offengelegt", wenn der Schritt bestelluebersicht erreicht wurde).
      # Am 21.08. ganz stillgelegt, aus demselben Grund wie in DP-006:
      #
      # Eine AKTIVE Bedingung auf einem zurueckgestellten Signal setzt die
      # ganze Regel auf jeder realen Seite auf "unklar" - DP-005 koennte dann
      # nie "unauffaellig" sagen. Und "unauffaellig" ist gegenueber dem
      # Unternehmen eine Entlastung, die wir schuldig bleiben wuerden.
      # Wieder aktivieren, sobald die Pfaderfassung die Bestelluebersicht
      # zuverlaessig erreicht (DP-005b).
      #
      # - condition: "additional_mandatory_cost_count > 0 and additional_mandatory_cost_disclosed_before_order == false"
      #   reason: Gesamtpreis nicht unmittelbar vor der Bestellung genannt,
      #           § 312j Abs. 2 BGB i. V. m. Art. 246a § 1 Abs. 1 S. 1 Nr. 5 EGBGB.
      #
      # - condition: "mandatory_price_delta > 0 and additional_mandatory_cost_first_display_after_product_page == true"
      #   reason: verpflichtender Preisbestandteil erst nach der Produktseite
      #           sichtbar. Eine Preiserhoehung ist fuer sich nicht unzulaessig.

      # GESTRICHEN 20.08. - jede mit Begruendung:
      #
      # "mandatory_total_price_at_checkout == false and
      #  required_total_price_can_be_calculated == true"
      #   Der zweite Name ist in _SIGNALE.md als Rechtsbegriff abgelehnt.
      #
      # "shipping_cost_amount > 0 and shipping_cost_disclosed == false and
      #  shipping_cost_can_be_calculated_in_advance == true"
      #   In sich unmoeglich: shipping_cost_amount ist laut _SIGNALE.md der
      #   "Betrag der AUF DER PRODUKTSEITE GENANNTEN Versandkosten" - ein Wert
      #   ueber 0 setzt voraus, dass sie genannt wurden. shipping_cost_disclosed
      #   ist zudem umbenannt, der dritte Name abgelehnt.
      #
      # "gratis_claim_present == true and costs_present_despite_gratis_claim
      #  == true and costs_are_unavoidable_delivery_or_offer_costs == false"
      #   Beide Zusatzsignale sind abgelehnt: das eine als Wertung, das andere
      #   als Schlussfolgerung, die in die Bedingung gehoert. Diese Bedingung
      #   stand ueber der korrigierten Gratis-Bedingung und haette sie, sobald
      #   jemand die Werte von Hand einträgt, stillschweigend verdraengt.
      #
      # "shipping_cost_disclosed == false and
      #  shipping_cost_can_be_calculated_in_advance == false"
      #   Loeste genau im Ausnahmefall aus: § 6 Abs. 2 PAngV verlangt die
      #   Hoehe nur, "soweit diese Kosten vernuenftigerweise im Voraus
      #   berechnet werden koennen". Was bleibt, ist die Pflicht nach
      #   § 6 Abs. 1 Nr. 2 PAngV, das ANFALLEN zusaetzlicher Kosten zu nennen -
      #   dafuer fehlt uns ein Signal, siehe offene_fragen.
      #
      # "price_delta > 0 and mandatory_price_delta > 0 and
      #  additional_mandatory_cost_disclosed == true and
      #  additional_mandatory_cost_disclosed_before_order == true"
      #   Beschreibt einen rechtstreuen Shop: der Preis stieg, und der
      #   verpflichtende Bestandteil wurde offengelegt, und zwar rechtzeitig.
      #   Widerspricht dem eigenen tatbestand_de dieser Regel.
      #
      # "price_delta_ratio > 0" als erstes Glied
      #   price_delta_ratio ist laut _SIGNALE.md Endpreis / Listenpreis, also
      #   auf jeder Seite mit Preis groesser 0 und bei unveraendertem Preis
      #   genau 1,0. Die Bedingung trug nichts bei, machte die Regel aber von
      #   einem weiteren 🟡-Signal abhaengig.

  menschliche_pruefung:
    - >
      Fällt das Angebot unter § 6 Abs. 3 PAngV? Die Absätze 1 und 2 gelten
      nicht für die in § 312 Abs. 2 Nr. 2, 3, 6, 9 und 10 sowie Abs. 4 BGB
      genannten Verträge — darunter Grundstücksverträge, Verbraucherbau-
      verträge, Teilzeit-Wohnrechte und langfristige Urlaubsprodukte,
      Warenautomaten und Versicherungsverträge. Für die Branche Reise ist das
      zu prüfen; ein Signal dafür gibt es nicht.
    - >
      Handelt es sich um eine Versteigerung? Dann ist die PAngV nach
      § 1 Abs. 2 PAngV nicht anzuwenden — für Ticketzweitmärkte relevant.
    - >
      Bezieht sich das Gratis-Versprechen auf dieselbe Ware, für die die
      Versandkosten anfallen?
    - "Sind die ausgewiesenen Versandkosten unvermeidbar im Sinne des zweiten Halbsatzes von Anhang Nr. 20 zu § 3 Abs. 3 UWG - wird insbesondere keine kostenlose Abholung angeboten?"
    - "Ist die Beeintraechtigung im Sinne des § 3a UWG spuerbar?"

  threshold_source: >
    Für versteckte Kosten besteht grundsätzlich kein prozentualer oder
    absoluter Mindestbetrag, ab dem ein Preisbestandteil erst rechtlich
    relevant wird. Maßgeblich ist vielmehr, ob es sich um einen
    verpflichtenden Preisbestandteil handelt und ob dieser nach den
    einschlägigen Vorschriften rechtzeitig und klar angegeben wurde.

    Für die PAngV ist insbesondere entscheidend, dass der Gesamtpreis
    einschließlich Umsatzsteuer und sonstiger Preisbestandteile angegeben
    wird und dass bei Fernabsatzverträgen zusätzliche Fracht-, Liefer-,
    Versand- oder sonstige Kosten sowie gegebenenfalls deren Höhe
    angegeben werden.

    Das technische Rulebook verwendet daher bewusst keinen Mindestwert
    wie 1 €, 5 % oder 10 %. Ein Betrag von 0,50 € kann ebenso relevant sein
    wie ein Betrag von 50 €, wenn es sich um einen nicht ordnungsgemäß
    angegebenen obligatorischen Preisbestandteil handelt.

    Das Merkmal der "spürbaren Beeinträchtigung" aus § 3a UWG ist davon
    getrennt zu beurteilen. Es soll nicht durch einen technisch erfundenen
    Preis-Schwellenwert ersetzt werden.

  false_positive_risks:

    - >
      Nicht jede Preiserhöhung im Verlauf des Bestellvorgangs ist
      rechtswidrig. Preisbestandteile können beispielsweise von der
      gewählten Menge, Lieferart, Lieferadresse oder einem vom Verbraucher
      selbst gewählten Zusatz abhängen.

    - >
      Versandkosten sind nicht generell unzulässig. Entscheidend ist,
      ob auf ihr Anfallen und, soweit vernünftigerweise im Voraus
      berechenbar, auf ihre Höhe rechtzeitig hingewiesen wurde.

    - >
      Regional unterschiedliche Steuern, Versandkosten oder sonstige
      variable Kosten können dazu führen, dass der endgültige Preis erst
      nach Eingabe weiterer Informationen berechnet werden kann.

    - >
      Optionale kostenpflichtige Zusatzleistungen dürfen nicht mit
      obligatorischen Preisbestandteilen gleichgesetzt werden. Für die
      Prüfung muss deshalb zwischen mandatory_price_delta und
      optional_price_delta unterschieden werden.

    - >
      Ein vorab niedriger angezeigter Preis kann zulässig sein, wenn
      eindeutig erkennbar ist, dass zusätzliche optionale Leistungen
      oder Kosten erst aufgrund einer späteren Verbraucherentscheidung
      hinzukommen.

    - >
      Ein "gratis"-Hinweis ist nicht in jedem Fall unzulässig, wenn neben
      dem kostenlosen Angebot nur Kosten anfallen, die nach Anhang Nr. 20
      zu § 3 Abs. 3 UWG ausdrücklich ausgenommen sind.

    - >
      Die bloße technische Differenz zwischen Produktpreis und
      Checkoutpreis beweist noch nicht, dass der erste Preis der
      rechtlich maßgebliche Gesamtpreis war.

    - >
      Eine fehlende Preisangabe im öffentlich sichtbaren Teil einer
      Website ist nicht automatisch ein Verstoß gegen § 3 PAngV, wenn
      wegen der konkreten Art des Angebots oder gesetzlicher Ausnahmen
      andere Regeln gelten.

  explanation_template_de: >
    PatternWatch hat im Bestellvorgang eine mögliche versteckte oder
    verspätet offengelegte Kostenkomponente festgestellt.

    Angezeigter Preis zu Beginn:
    [INITIAL_PRICE]

    Angezeigter Preis unmittelbar vor der Bestellung:
    [CHECKOUT_PRICE]

    Preisabweichung:
    [PRICE_DELTA]

    Zusätzlicher Kostenbestandteil:
    [COST_COMPONENT]

    Zeitpunkt der erstmaligen Offenlegung:
    [DISCLOSURE_POINT]

    Mögliche rechtliche Relevanz besteht insbesondere im Hinblick auf
    § 3 und § 6 PAngV sowie §§ 5, 5a und 5b UWG und, bei einem
    elektronischen Verbrauchervertrag, § 312j Abs. 2 BGB.

    Die Feststellung bedeutet nicht, dass jede Preisänderung während
    des Bestellvorgangs unzulässig ist. Entscheidend ist insbesondere,
    ob der zusätzliche Kostenbestandteil verpflichtend ist und ob er
    rechtzeitig, klar und verständlich offengelegt wurde.

  offene_fragen:
    - >
      Für § 6 Abs. 1 Nr. 2 PAngV fehlt ein Signal, das nur das ANFALLEN
      zusätzlicher Kosten erfasst, ohne deren Höhe. Vorschlag an das
      Entwicklungsteam: `additional_costs_mentioned_on_product_page`, bool.
    - >
      DP-005b: Ein `false` bei `additional_mandatory_cost_disclosed_before_order`
      darf nur gesetzt werden, wenn der Schritt `bestelluebersicht`
      tatsächlich erreicht wurde. Sonst gehört das Signal nach
      `signal_errors`.
    - >
      Die Prüfung sollte perspektivisch um eine eigenständige Regel
      für Preisermäßigungen nach § 11 PAngV ergänzt werden. Bei der
      Bekanntgabe einer Preisermäßigung für Waren ist grundsätzlich der
      niedrigste Gesamtpreis anzugeben, den der Unternehmer innerhalb
      der letzten 30 Tage vor der Preisermäßigung angewendet hat.
      Dafür ist eine historische Preisbeobachtung besonders geeignet.
    - >
      Die Prüfung von vorausgewählten kostenpflichtigen Zusatzleistungen
      sollte perspektivisch als eigene Dark-Pattern-Regel weiter
      ausdifferenziert werden, weil hierfür neben den Preisangaben auch
      die rechtlichen Anforderungen an zusätzliche Zahlungen relevant
      sein können.
    - >
      Die technische Erkennung muss unterscheiden können zwischen
      obligatorischen und optionalen Kostenbestandteilen.

  disclaimer_required: true
