# ============================================================
# VORLAGE – bitte kopieren, nicht überschreiben
# ============================================================
# Alles nach einem # ist Kommentar und wird vom System ignoriert.
# Die Erklärungen dürfen stehen bleiben.
# ============================================================

- id: DP-00X
  name_de: "Kurzer, sprechender Titel des Musters"

  # ----------------------------------------------------------
  # KATEGORIE  (neu, 19.08. - Vorgabe der Verbraucherzentrale)
  # ----------------------------------------------------------
  # Genau EINER dieser vier Werte. Es ist das Raster, in dem die
  # Verbraucherzentrale selbst denkt - danach wird in der
  # Marktuebersicht gefiltert und statistisch ausgewertet.
  #
  #   Zeitdruck     - Countdown, Knappheit, "X Personen sehen sich das an"
  #   Zwang         - Kopplung, erzwungene Einwilligung
  #   Hindernisse   - erschwerte Ablehnung, fehlender Kuendigungsbutton
  #   Irrefuehrung    - falsche oder verdeckte Angaben
  kategorie: ""

  # ----------------------------------------------------------
  # ORGANISATION
  # ----------------------------------------------------------
  status: ENTWURF          # ENTWURF | IN_ARBEIT | REVIEW | FERTIG
  bearbeiter: ""           # Name

  # ----------------------------------------------------------
  # ANWENDBARKEIT
  # ----------------------------------------------------------
  # Wann greift diese Regel überhaupt? Sind diese Bedingungen
  # nicht erfüllt, wird die Regel gar nicht erst geprüft.
  #
  # Das ist unser wichtigster Schutz gegen Fehlalarme: § 312k BGB
  # etwa gilt nur bei Dauerschuldverhältnissen – ein einfacher
  # Onlineshop darf hier nicht auffällig werden.
  #
  # Nur Signale aus _SIGNALE.md, Abschnitt "Kontext".
  # Drei Verknuepfungen stehen zur Verfuegung (A3, entschieden am 20.08.):
  #   all:   ALLE muessen zutreffen
  #   any:   MINDESTENS EINES muss zutreffen
  #   none:  KEINES darf zutreffen
  # Eine flache Liste ohne Schluesselwort wird wie "all:" behandelt.
  applies_when:
    all:
      - "is_b2c_offer == true"
    # any:
    #   - "recurring_price_notation_present == true"
    #   - "min_contract_term_stated == true"
    # none:
    #   - "is_financial_services == true"

  # Kann eine Bedingung in applies_when nicht ausgewertet werden, weil das
  # Signal fehlt, gilt: Wuerde die Regel sonst anschlagen -> "unklar".
  # Wuerde sie ohnehin nicht anschlagen -> die Regel wird stillschweigend
  # uebersprungen. So wird der Bericht nicht mit "unklar" geflutet.

  # ----------------------------------------------------------
  # RECHTLICHE GRUNDLAGE
  # ----------------------------------------------------------
  # So präzise wie möglich: Norm, Absatz, Satz, Nummer.
  legal_basis:
    - ""
    - ""

  # Ein bis zwei Sätze in verständlicher Sprache: Was verlangt
  # die Norm? Dieser Text erscheint im Bericht und wird von
  # Nichtjuristen gelesen.
  tatbestand_de: >
    

  # Über welchen Weg wird daraus ein durchsetzbarer Anspruch?
  # Das ist entscheidend für die Nutzbarkeit: Eine Verbraucher-
  # zentrale kann z. B. aus einem PAngV-Verstoß allein nichts
  # herleiten – erst über § 3a UWG entsteht der Anspruch aus § 8 UWG.
  #
  # Beispiel:
  #   "PAngV (Marktverhaltensregel) -> § 3a UWG ->
  #    Unterlassungsanspruch § 8 Abs. 1 UWG,
  #    Aktivlegitimation § 8 Abs. 3 Nr. 3 UWG"
  anspruchskette: >
    

  # ----------------------------------------------------------
  # SIGNALE
  # ----------------------------------------------------------
  # AUSSCHLIESSLICH Einträge aus _SIGNALE.md.
  # Nur die, die ihr unten in verdict_rules auch verwendet.
  signals:
    - 

  # ----------------------------------------------------------
  # BEWERTUNGSREGELN
  # ----------------------------------------------------------
  # Bedingungen als Ausdrücke: > < >= <= == !=
  # Innerhalb einer Stufe gilt ODER: eine erfüllte Bedingung genügt.
  # Sollen mehrere Bedingungen zusammen gelten (UND), schreibt
  # sie in eine Zeile mit "and".
  #
  # eindeutig    -> kaum bestreitbar, kein Wertungsspielraum
  # verdaechtig  -> belastbarer Anhaltspunkt, Auslegung möglich
  #
  # "unklar" müsst ihr nicht angeben – das vergibt das System
  # automatisch, wenn ein benötigtes Signal nicht erhoben werden
  # konnte. Trifft nichts zu: "unauffällig".
  # Zwei Schreibweisen sind zulaessig (A2, entschieden am 20.08.):
  #
  #   Kurzform  - nur die Bedingung als Zeichenkette
  #   Langform  - condition + reason
  #
  # Die Langform ist die bevorzugte: "reason" erscheint in der Beweisakte
  # als Begruendung genau dieses Befundes. Damit erhaelt jede ausgeloeste
  # Bedingung ihren eigenen Text, statt eines Sammeltextes fuer die ganze
  # Regel. Der Platzhalter {befund} im explanation_template_de wird durch
  # das "reason" der ausgeloesten Bedingung ersetzt.
  #
  # KEIN Feld "severity". Wir haben genau eine Skala: eindeutig /
  # verdaechtig / unklar / unauffaellig. Eine zweite Schwereskala daneben
  # muessten wir in der Praesentation erklaeren und verteidigen.
  #
  # Operatoren:  >  <  >=  <=  ==  !=  and  or
  #              in / not in   (Zugehoerigkeit zu einer Liste aus "listen:")
  #              contains_any / not_contains_any
  #                            (kommt eines der Woerter aus einer Liste IM
  #                             Text vor? Fuer Freitext-Signale wie
  #                             countdown_text - dort waere ein Vergleich
  #                             auf Gleichheit sinnlos, weil der Text nie
  #                             exakt einem Listeneintrag entspricht.)
  #
  # FEHLENDE SIGNALE: Jede Bedingung wird EINZELN ausgewertet. Kann eine
  # Bedingung nicht ausgewertet werden, weil ein Signal fehlt, wird nur
  # SIE uebersprungen und im Bericht vermerkt - die uebrigen Bedingungen
  # gelten weiter. Loest danach mindestens eine Bedingung aus, steht der
  # Befund. Loest keine aus und wurde mindestens eine uebersprungen,
  # lautet der Befund "unklar".
  #
  # Praktische Folge: Eine Regel funktioniert bereits, wenn nur ein Teil
  # ihrer Signale erhoben werden konnte. DP-004 liefert deshalb schon am
  # Donnerstag einen Befund ueber has_kuendigungsbutton, obwohl die
  # Signale zur Bestaetigungsseite erst am Freitag dazukommen.
  verdict_rules:
    eindeutig:
      - condition: ""
        reason: >
          

    verdaechtig:
      # Kurzform, wenn keine eigene Begruendung noetig ist:
      - ""

  # ----------------------------------------------------------
  # LISTEN
  # ----------------------------------------------------------
  # Benannte Wortlisten fuer die Operatoren "in" und "not in".
  # Damit lassen sich zulaessige und unzulaessige Beschriftungen
  # pflegen, ohne dass jemand programmieren muss.
  #
  # Beispiel:
  #   listen:
  #     zulaessige_labels:
  #       - "Vertraege hier kuendigen"
  #       - "Vertrag hier kuendigen"
  #     unzulaessige_labels:
  #       - "Kontakt"
  #       - "Mein Konto"
  #
  #   verdict_rules:
  #     eindeutig:
  #       - condition: "kuendigungsbutton_label in unzulaessige_labels"
  #     verdaechtig:
  #       - condition: "kuendigungsbutton_label not in zulaessige_labels"
  #
  # Trifft weder Positiv- noch Negativliste zu, bleibt es "unauffaellig" -
  # bewusst, denn "entsprechend eindeutig" laesst Spielraum.
  listen: {}

  # Woher kommen die Zahlen oben?
  # Rechtsprechung, Leitlinien, Literatur – oder ehrlich:
  # "Eigene Festlegung des Teams." Das ist zulässig und wird
  # in der Präsentation offengelegt. Erfundene Fundstellen
  # sind das Einzige, was uns wirklich schadet.
  threshold_source: >
    

  # ----------------------------------------------------------
  # FEHLALARME
  # ----------------------------------------------------------
  # In welchen Fällen könnte diese Regel anschlagen, obwohl
  # alles rechtmäßig ist? Je vollständiger diese Liste, desto
  # besser können wir gegensteuern – und desto überzeugender
  # ist unsere Präsentation.
  false_positive_risks:
    - ""

  # ----------------------------------------------------------
  # BERICHTSTEXT
  # ----------------------------------------------------------
  # Erscheint wörtlich im Beweisbericht. Platzhalter in
  # geschweiften Klammern werden durch die gemessenen Werte ersetzt.
  #
  # Sachlich formulieren, keine Feststellung eines Verstoßes,
  # sondern Beschreibung des Befundes und seiner rechtlichen
  # Einordnung.
  #
  # WICHTIG: Platzhalter in geschweiften Klammern muessen den EXAKTEN
  # Signalnamen tragen - {price_listed}, nicht {Preis} oder [PREIS].
  # Ein Name, den es nicht gibt, bleibt als Text stehen.
  # Zusaetzlich verfuegbar:
  #   {schritt}  - auf welchem Schritt des Pfades gemessen wurde
  #   {befund}   - das "reason" der ausgeloesten Bedingung
  explanation_template_de: >
    

  # ----------------------------------------------------------
  # MENSCHLICHE PRUEFUNG   (neu, A4, entschieden am 20.08.)
  # ----------------------------------------------------------
  # Tatbestandsmerkmale, die das System nicht feststellen kann, weil sie
  # eine rechtliche Wertung erfordern. Sie verschwinden damit nicht -
  # sie erscheinen in der Beweisakte als Pruefliste unter dem Befund:
  #
  #   "Technisch festgestellt: A, B, C.
  #    Rechtlich noch zu pruefen: X, Y."
  #
  # Als Frage formulieren, die eine Juristin mit ja/nein beantworten kann.
  #
  # Beispiele:
  #   - "Ist die Beeintraechtigung im Sinne des § 3a UWG spuerbar?"
  #   - "Ist fuer diesen Vertragstyp eine strengere Form vorgeschrieben?"
  menschliche_pruefung:
    - ""

  # ----------------------------------------------------------
  # OFFENE FRAGEN
  # ----------------------------------------------------------
  # Alles, was ihr nicht abschließend klären konntet.
  # Diese Liste ist wertvoll – sie wird zur Grundlage unserer
  # Antworten in der Fragerunde. Bitte nichts weglassen,
  # nur weil es unfertig wirkt.
  offene_fragen:
    - ""

  disclaimer_required: true
