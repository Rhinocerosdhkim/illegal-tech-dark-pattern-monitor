# ============================================================
# ENTWURF - bitte vervollstaendigen
#
# Guter Einstieg: Die technische Pruefung ist trivial (Element
# vorhanden ja/nein). Die eigentliche juristische Arbeit liegt in
# der Frage, WANN die Vorschrift ueberhaupt gilt - das Feld
# applies_when ist hier wichtiger als die Bewertungsregeln.
#
# Dieses Muster ist die rechtliche Antwort auf das sogenannte
# "Roach Motel": Anmeldung in zwei Klicks, Kuendigung nur per
# Telefon oder Brief.
# ============================================================

- id: DP-004
  name_de: "Fehlender oder nicht unmittelbar erreichbarer Kuendigungsbutton"

  status: ENTWURF
  bearbeiter: ""

  applies_when:
    # ZENTRALE FRAGE dieser Regel - bitte praezisieren.
    # Ein einfacher Onlineshop ohne Dauerschuldverhaeltnis darf hier
    # keinesfalls auffaellig werden.
    - "is_b2c_offer == true"
    - "has_recurring_contract_keywords == true"
    # Reicht das? Welche weiteren Voraussetzungen nennt § 312k BGB?

  legal_basis:
    # VORSCHLAG - bitte pruefen und ergaenzen
    - "§ 312k Abs. 2 BGB (Kuendigungsschaltflaeche)"
    - "§ 312k Abs. 6 BGB (Rechtsfolge bei Verstoss)"
    # - weitere Absaetze? Bestaetigungsseite, Bestaetigung in Textform?

  tatbestand_de: >
    AUSFUELLEN.
    Bitte auch aufnehmen: Anforderungen an die Beschriftung, das Erfordernis
    der staendigen Verfuegbarkeit sowie der unmittelbaren und leichten
    Erreichbarkeit, und die Bestaetigungsseite.

  anspruchskette: >
    AUSFUELLEN.
    Ist § 312k BGB Marktverhaltensregel i. S. d. § 3a UWG? Bitte kurz belegen.
    Zusaetzlich die individualvertragliche Ebene: Welche Rechtsfolge sieht
    Abs. 6 fuer den einzelnen Verbraucher vor? Diese ist fuer die
    Verbraucherberatung besonders praktisch verwertbar.

  signals:
    - has_kuendigungsbutton
    - kuendigungsbutton_label
    - kuendigungsbutton_click_depth        # Status GELB
    - kuendigungsbutton_confirm_label      # Status GELB
    - has_recurring_contract_keywords

  verdict_rules:
    eindeutig:
      # VORSCHLAG:
      - "has_kuendigungsbutton == false"
    verdaechtig:
      # Button vorhanden, aber schwer erreichbar. Ab welcher Klicktiefe
      # ist "unmittelbar erreichbar" nicht mehr gewahrt?
      - "kuendigungsbutton_click_depth > ?"
      # Beschriftung unklar - welche Formulierungen genuegen?
      - "kuendigungsbutton_label not_in_whitelist [ AUSFUELLEN ]"

  threshold_source: >
    AUSFUELLEN.
    Insbesondere: Gibt es zur Klicktiefe Rechtsprechung oder Hinweise in der
    Literatur? Falls nicht, bitte eigene Festlegung offenlegen und begruenden.

  false_positive_risks:
    - >
      Reine Kaufvertraege ohne Dauerschuldverhaeltnis. Groesstes Risiko
      dieser Regel - die Stichworterkennung in applies_when kann fehlgehen
      (z. B. Shop, der nebenbei einen Newsletter als "Abo" bezeichnet).
    - >
      Der Kuendigungsbutton befindet sich haeufig erst im eingeloggten Bereich.
      Unsere Erfassung erfolgt ohne Anmeldung. Bitte einordnen: Genuegt es
      nach § 312k BGB, den Button nur nach Anmeldung bereitzustellen?
      Davon haengt ab, ob wir hier ueberhaupt "eindeutig" vergeben duerfen.
    - AUSFUELLEN

  explanation_template_de: >
    AUSFUELLEN.

  offene_fragen:
    - >
      WICHTIG: Muss der Kuendigungsbutton auch fuer nicht angemeldete Nutzer
      sichtbar sein? Falls nein, muessen wir "eindeutig" streichen und auf
      "verdaechtig" zuruecknehmen, weil unsere Erfassung ohne Anmeldung
      erfolgt. Bitte vorrangig klaeren - das entscheidet ueber die
      Verwertbarkeit der ganzen Regel.
    - >
      Gilt § 312k BGB auch fuer Vertraege, die vor dem 01.07.2022
      geschlossen wurden?
    - AUSFUELLEN

  disclaimer_required: true
