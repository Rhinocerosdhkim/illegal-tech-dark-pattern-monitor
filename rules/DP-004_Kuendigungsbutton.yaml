- id: DP-004
  name_de: "Fehlender oder nicht unmittelbar und leicht erreichbarer Kündigungsbutton"

  kategorie: "Hindernisse"

  status: REVIEW
  bearbeiter: "Jura-Team"

  # Umgestellt 20.08. auf Namen aus _SIGNALE.md (ABSTIMMUNG Korb B/C).
  # Vorher standen hier fuenf rechtliche Qualifikationen, die niemand misst;
  # die Regel war dadurch auf JEDER Seite "unklar" und damit wertlos -
  # obwohl ihre staerkste Bedingung (has_kuendigungsbutton == false) auf
  # einem laengst zugesagten Signal beruht.
  #
  #   is_consumer_contract              -> is_b2c_offer
  #   contract_concludable_on_website   -> order_button_found
  #   is_electronic_business_transaction-> dieselbe Tatsache, entfaellt
  #   entrepreneur_owes_paid_performance-> has_price_display + order_button_found
  #   is_dauerschuldverhaeltnis         -> die drei starken Tatsachensignale
  #   stricter_form_required            -> nach menschliche_pruefung verschoben
  applies_when:
    all:
      - "is_b2c_offer == true"
      - "order_button_found == true"
      - "has_price_display == true"
    any:
      # Verschaerft 20.08. "recurring_price_notation_present" allein reicht
      # nicht: das Signal erfasst jede Periodenangabe im Preis, also auch
      # Finanzierungs- und Ratenhinweise ("ab 9,99 €/Monat") auf einem
      # gewoehnlichen Einmalkauf-Shop. Eine Zahlungsweise sagt nichts ueber
      # ein Dauerschuldverhaeltnis. Die beiden anderen Signale bezeichnen
      # dagegen unmittelbar eine fortlaufende Bindung; sie tragen allein.
      - "min_contract_term_stated == true"
      - "auto_renewal_text_present == true"
      - "recurring_price_notation_present == true and cancellation_terms_present == true"
      - "recurring_price_notation_present == true and has_recurring_contract_keywords == true"
    none:
      - "is_financial_services == true"

  # Aus den drei Tatsachensignalen auf ein Dauerschuldverhaeltnis zu
  # schliessen, ist eine Ableitung, keine Feststellung - und sie ist je
  # Produkt verschieden, laesst sich also nicht site-weit im Zielprofil
  # bestaetigen. Nach C4 bleibt die Regel deshalb auf "verdaechtig"
  # begrenzt, bis ein Mensch den Vertragstyp bestaetigt.
  applicability_derived: true

  legal_basis:
    - "§ 312k Abs. 1 BGB"
    - "§ 312k Abs. 2 BGB"
    - "§ 312k Abs. 6 BGB"
    - "§ 3a UWG"

  tatbestand_de: >
    Ist § 312k Abs. 1 BGB anwendbar, muss der Unternehmer auf der Website
    eine Kündigungsschaltfläche bereitstellen, über die der Verbraucher
    eine ordentliche oder außerordentliche Kündigung eines auf der Website
    abschließbaren Vertrags erklären kann. Die Kündigungsschaltfläche muss
    gut lesbar mit "Verträge hier kündigen" oder einer entsprechend
    eindeutigen Formulierung beschriftet sein. Sie muss den Verbraucher
    unmittelbar zu einer Bestätigungsseite führen. Die Bestätigungsseite
    muss die in § 312k Abs. 2 S. 3 Nr. 1 BGB genannten Angaben ermöglichen
    und eine Bestätigungsschaltfläche enthalten, die gut lesbar mit
    "jetzt kündigen" oder einer entsprechend eindeutigen Formulierung
    beschriftet ist. Die Kündigungsschaltfläche, die Bestätigungsschaltfläche
    und die Bestätigungsseite müssen ständig verfügbar sowie unmittelbar
    und leicht zugänglich sein.

  anspruchskette: >
    § 312k BGB ist eine Marktverhaltensregel im Sinne des § 3a UWG.
    Ein Verstoß gegen § 312k kann daher bei Vorliegen der weiteren
    Voraussetzungen einen Wettbewerbsverstoß nach § 3a UWG darstellen.
    Nach § 312k Abs. 6 BGB kann der Verbraucher den Vertrag bei fehlender
    ordnungsgemäßer Bereitstellung der nach Abs. 1 und 2 erforderlichen
    Schaltflächen und der Bestätigungsseite jederzeit und ohne Einhaltung
    einer Kündigungsfrist kündigen. Die außerordentliche Kündigung bleibt
    unberührt.

  signals:

    # 1. Kuendigungsschaltflaeche  (§ 312k Abs. 2 S. 1, 2)
    - "has_kuendigungsbutton"               # gruen
    - "kuendigungsbutton_label"             # gruen
    - "kuendigungsbutton_font_size_px"      # gruen
    - "kuendigungsbutton_contrast_ratio"    # gruen
    - "kuendigungsbutton_hidden_in_menu"    # gruen
    - "kuendigungsbutton_click_depth"       # gelb
    - "kuendigungsbutton_requires_login"    # gelb

    # 2. Bestaetigungsseite  (§ 312k Abs. 2 S. 3)
    - "has_confirmation_page"               # gelb
    - "confirmation_page_directly_reached"  # gelb
    - "confirmation_page_requires_login"    # gelb

    # 3. Bestaetigungsschaltflaeche  (§ 312k Abs. 2 S. 3)
    - "has_confirmation_button"             # gelb
    - "confirmation_button_label"           # gelb
    - "confirmation_button_font_size_px"    # gelb
    - "confirmation_button_contrast_ratio"  # gelb

  # ----------------------------------------------------------
  # LISTEN
  # ----------------------------------------------------------
  # Das Gesetz verlangt fuer BEIDE Schaltflaechen einen Wortlaut
  # "oder eine entsprechend eindeutige Formulierung". Deshalb zwei
  # getrennte Listen. Bitte ergaenzen - bisher steht nur der
  # gesetzliche Wortlaut selbst darin.
  # Erweitert 20.08. Beide Listen enthielten je einen Eintrag, verglichen
  # wird aber auf vollstaendige Zeichengleichheit. Damit war praktisch jede
  # rechtstreue Einzelvertrags-Seite ein Verdachtsfall. § 312k Abs. 2 S. 2
  # BGB laesst ausdruecklich "eine entsprechend eindeutige Formulierung" zu -
  # eine geschlossene Liste kann das nicht abbilden (T4). Die Stufe bleibt
  # deshalb "verdaechtig"; eine Negativliste wie in DP-002 ist hier nicht
  # moeglich, weil eine Kuendigungsschaltflaeche ohne Kuendigungsbezug
  # praktisch nicht vorkommt.
  listen:
    zulaessige_kuendigungs_labels:
      - "Verträge hier kündigen"
      - "Vertrag hier kündigen"
      - "Abo hier kündigen"
      - "Abonnement hier kündigen"
      - "Mitgliedschaft hier kündigen"
      - "Hier kündigen"
    zulaessige_bestaetigungs_labels:
      - "jetzt kündigen"
      - "Vertrag jetzt kündigen"
      - "Abo jetzt kündigen"
      - "Kündigung jetzt absenden"
      - "Kündigung absenden"

  verdict_rules:
    eindeutig:
      # Von drei eindeutig-Bedingungen bleibt eine (20.08.). Massgeblich ist
      # T3: ein Befund darf sich nur auf etwas stuetzen, das wir GESEHEN
      # haben. Die Erfassung besucht drei bis vier Seiten eines Ziels und
      # sucht nach Stichworten - "nicht gefunden" ist Abwesenheit von Beweis,
      # nicht Beweis der Abwesenheit. Dieselbe Begruendung, mit der
      # "required_info_found == false" in DP-006 auf "verdaechtig" steht.
      - condition: "has_confirmation_page == true and has_confirmation_button == false"
        reason: >
          Die Bestätigungsseite wurde erreicht und enthält keine
          Bestätigungsschaltfläche. § 312k Abs. 2 S. 3, S. 4 BGB verlangt
          eine solche Schaltfläche. Die Bestätigungsseite ist hier
          tatsächlich aufgerufen worden, der Befund beruht also auf einer
          Beobachtung und nicht auf einer erfolglosen Suche.

    verdaechtig:
      # HERUNTERGESTUFT 20.08. nach T3, siehe oben.
      - condition: "has_kuendigungsbutton == false"
        reason: >
          Auf den erfassten Seiten wurde keine Kündigungsschaltfläche
          gefunden. § 312k Abs. 2 S. 1 BGB verlangt eine solche Schaltfläche,
          die ständig verfügbar sowie unmittelbar und leicht zugänglich ist.
          Die Erfassung hat nur die Schritte des Zielpfads besucht; ob die
          Schaltfläche an anderer Stelle vorhanden ist, ist zu prüfen.

      # HERUNTERGESTUFT 20.08. nach T3, mit Ausschluss des haeufigsten
      # Messgrundes: hindert eine Anmeldung die Erfassung, ist "keine
      # Bestaetigungsseite" keine Aussage ueber die Seite.
      - condition: "has_kuendigungsbutton == true and has_confirmation_page == false and kuendigungsbutton_requires_login == false"
        reason: >
          Die Kündigungsschaltfläche führte im erfassten Ablauf zu keiner
          Bestätigungsseite. § 312k Abs. 2 S. 3 BGB verlangt, dass sie den
          Verbraucher unmittelbar zu einer Bestätigungsseite führt.

      # Beschriftung ausserhalb der Positivliste - "entsprechend eindeutig"
      # laesst Spielraum, deshalb hoechstens verdaechtig.
      - condition: "kuendigungsbutton_label not in zulaessige_kuendigungs_labels"
        reason: >
          Die Beschriftung der Kündigungsschaltfläche entspricht nicht dem
          gesetzlichen Wortlaut. Ob sie eine "entsprechend eindeutige
          Formulierung" darstellt, bedarf der Prüfung.

      - condition: "confirmation_button_label not in zulaessige_bestaetigungs_labels"
        reason: >
          Die Beschriftung der Bestätigungsschaltfläche entspricht nicht dem
          gesetzlichen Wortlaut.

      - condition: "kuendigungsbutton_hidden_in_menu == true"
        reason: >
          Die Kündigungsschaltfläche ist nur über ein zugeklapptes Menü
          erreichbar. § 312k Abs. 2 verlangt unmittelbare und leichte
          Zugänglichkeit.

      - condition: "confirmation_page_directly_reached == false"
        reason: >
          Zwischen Kündigungsschaltfläche und Bestätigungsseite liegt ein
          Zwischenschritt.

      - condition: "confirmation_page_requires_login == true"
        reason: >
          Vor der Bestätigungsseite steht eine Anmeldeaufforderung.

      - condition: "kuendigungsbutton_requires_login == true"
        reason: >
          Die Kündigungsschaltfläche ist erst nach einer Anmeldung erreichbar.

      # DEAKTIVIERT, 20.08. -- "> 0" trifft auf praktisch jede Website zu:
      # eine Kuendigungsschaltflaeche liegt nie auf der Startseite selbst.
      # Die Bedingung wuerde also immer ausloesen und widerspricht dem
      # eigenen threshold_source. Bitte belastbaren Wert einsetzen oder
      # ersatzlos streichen (Punkt B2).
      # - condition: "kuendigungsbutton_click_depth > ?"

  threshold_source: >
    Zum Anwendungsbereich: BGH, Urteil vom 22.05.2025, I ZR 161/24
    (Kündigungsschaltfläche; Kläger war der Bundesverband der
    Verbraucherzentralen). Danach ist eine Kündigungsschaltfläche auch dann
    bereitzustellen, wenn der Verbraucher für die vertraglichen Leistungen
    ein EINMALIGES Entgelt zu entrichten hat und der Vertrag nach Ablauf der
    vereinbarten Laufzeit automatisch endet. Für uns folgt daraus, dass die
    Tatsachensignale unter „any:" den Anwendungsbereich eher zu ENG als zu
    weit abbilden — was in der gewählten Richtung liegt, aber bei der
    Auswertung mitzudenken ist.

    Es gibt keinen gesetzlichen festen Schwellenwert für die zulässige
    Klicktiefe. Maßgeblich sind die gesetzlichen Anforderungen an die
    ständige Verfügbarkeit sowie die unmittelbare und leichte
    Zugänglichkeit nach § 312k Abs. 2 S. 4 BGB. Die Rechtsprechung stellt
    auf den konkreten Such- und Zugangsaufwand ab. Ein zusätzlicher
    Such- oder Navigationsschritt kann die leichte Zugänglichkeit
    beeinträchtigen; ein vorgeschalteter Login kann die Anforderungen
    verletzen. Die Klicktiefe darf deshalb nicht allein über die
    Rechtswidrigkeit entscheiden.

  false_positive_risks:
    - >
      Einmalige Kaufverträge ohne Dauerschuldverhältnis fallen nicht unter
      § 312k BGB.
    - >
      Begriffe wie "Abo", "Mitgliedschaft" oder "Newsletter" reichen allein
      nicht aus, um ein Dauerschuldverhältnis festzustellen.
    - >
      Ein Login ist nicht in jedem Fall unzulässig. Bei Diensten, deren
      Nutzung ihrer Natur nach ein regelmäßiges Login voraussetzt, ist eine
      gesonderte Bewertung erforderlich.
    - >
      Eine abweichende Beschriftung ist nicht automatisch unzulässig, wenn
      sie im konkreten Kontext eindeutig als Kündigungsmöglichkeit
      verständlich ist.
    - >
      Bloßes Scrollen oder eine große Anzahl von Seitenelementen begründet
      nicht automatisch einen Verstoß. Entscheidend ist, ob die
      Kündigungsschaltfläche tatsächlich leicht auffindbar und zugänglich ist.

  explanation_template_de:
    eindeutig: >
      Die Bestätigungsseite nach § 312k Abs. 2 S. 3 BGB wurde erreicht. Sie
      enthält keine Bestätigungsschaltfläche, mit der die Kündigungserklärung
      abgegeben werden könnte.

      {befund}

      Bei einem Verstoß gegen § 312k Abs. 1 und 2 BGB kann der Verbraucher
      nach § 312k Abs. 6 BGB den Vertrag jederzeit ohne Einhaltung einer
      Kündigungsfrist kündigen.

    verdaechtig: >
      {befund}

      Ob die Website in den Anwendungsbereich des § 312k BGB fällt, ist aus
      Tatsachensignalen abgeleitet und nicht festgestellt; die Punkte unter
      „Rechtlich noch zu prüfen" sind vorrangig zu klären. **Mit diesem
      Befund wird kein Verstoß festgestellt.**

    unklar: >
      Zu dieser Regel konnten nicht alle benötigten Messwerte erhoben werden.
      Insbesondere setzen mehrere Signale voraus, dass die Kündigungsstrecke
      tatsächlich durchgeklickt wurde. Eine Aussage zur Sache wird nicht
      getroffen.

  # ZUSAMMENGEFUEHRT 20.08. Dieser Schluessel stand zweimal in der Datei.
  # YAML behaelt den letzten - die beiden Fragen, die am selben Tag oben
  # ergaenzt worden waren, erreichten die Engine nie. Wer die Datei las, sah
  # fuenf Eintraege; in der Beweisakte standen drei.
  menschliche_pruefung:
    - "Liegt tatsächlich ein Dauerschuldverhältnis im Sinne des § 312k Abs. 1 S. 1 BGB vor? Die Tatsachensignale liefern dafür nur Anhaltspunkte."
    - "Ist für diesen Vertragstyp eine strengere Form als die Textform vorgeschrieben (§ 312k Abs. 1 S. 2 Nr. 1 BGB)? Dann greift die Vorschrift nicht."
    - "Setzt der Dienst seiner Natur nach ein regelmäßiges Login voraus? Falls ja, ist ein vorgeschalteter Login nicht ohne Weiteres unzulässig."
    - "Ermöglicht die Bestätigungsseite die nach § 312k Abs. 2 erforderlichen Angaben?"
    - "Wurde die Kündigungsstrecke tatsächlich durchgeklickt? Nur dann sagt ein fehlender Befund etwas über die Seite aus."

  offene_fragen:
    - >
      Ab welcher Klicktiefe ist die "unmittelbare und leichte
      Zugaenglichkeit" nach § 312k Abs. 2 S. 4 BGB nicht mehr gewahrt?
      Die urspruengliche Bedingung "> 0" wurde deaktiviert, weil sie auf
      jeder Website ausloest. Entweder ein belastbarer Wert mit Begruendung
      oder ersatzlose Streichung der Bedingung.
    - >
      Welche Beschriftungen gelten als "entsprechend eindeutige
      Formulierung" neben "Vertraege hier kuendigen"? Fuer die maschinelle
      Pruefung brauchen wir eine Positivliste; alles ausserhalb dieser
      Liste kann hoechstens "verdaechtig" werden.
    - >
      Mehrere Voraussetzungen in applies_when sind rechtliche Bewertungen
      und maschinell nicht feststellbar (Dauerschuldverhaeltnis,
      Verbrauchervertrag, elektronischer Geschaeftsverkehr). Wie gehen wir
      damit um - Stufe "unklar" oder ein eigenes Feld fuer die menschliche
      Pruefung? Siehe docs/ABSTIMMUNG_Regelwerk.md, Punkt 1.

  disclaimer_required: true
