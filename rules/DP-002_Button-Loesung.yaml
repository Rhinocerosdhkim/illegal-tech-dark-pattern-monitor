# ============================================================
# MUSTERBEISPIEL – im Kickoff gemeinsam erarbeitet
#
# Diese Regel ist unser verlässlichstes Muster: Der EuGH hat
# entschieden, dass allein die Beschriftung des Buttons maßgeblich
# ist und die Begleitumstände außer Betracht bleiben. Damit ist
# die Prüfung ein reiner Textabgleich - maschinell nahezu
# fehlerfrei feststellbar.
# ============================================================

- id: DP-002
  name_de: "Fehlende oder unzureichende Button-Beschriftung bei kostenpflichtiger Bestellung"

  # Kategorie nach dem Raster der Verbraucherzentrale (19.08.):
  # Zeitdruck | Zwang | Hindernisse | Irrefuehrung
  # -- Vorbelegung durch das Entwicklungsteam, bitte pruefen --
  kategorie: "Irrefuehrung"

  status: REVIEW
  bearbeiter: "Kickoff-Workshop"

  # Ergaenzt 20.08.: has_price_display. Weder is_b2c_offer (eine Heuristik
  # ueber Preisangaben) noch has_checkout_flow ("existiert ein
  # Bestellvorgang") stellen fest, dass ueberhaupt ein Entgelt geschuldet
  # ist - § 312j Abs. 2 setzt einen ENTGELTLICHEN Vertrag voraus. Eine
  # kostenlose Registrierung mit "Jetzt anmelden" haette sonst die staerkste
  # Stufe erreicht.
  #
  # Finanzdienstleistungen sind ausgenommen: § 312j Abs. 5 S. 2 BGB.
  applies_when:
    all:
      - "is_b2c_offer == true"
      - "has_checkout_flow == true"
      - "order_button_found == true"
      - "has_price_display == true"
    none:
      - "is_financial_services == true"

  legal_basis:
    - "§ 312j Abs. 3 BGB (Beschriftung der Schaltfläche)"
    - "§ 312j Abs. 4 BGB (Vertrag kommt nur bei Einhaltung zustande)"
    - "§ 312i Abs. 1 BGB (Pflichten im elektronischen Geschäftsverkehr)"

  tatbestand_de: >
    Bei einem entgeltlichen Verbrauchervertrag im elektronischen Geschäftsverkehr
    muss der Unternehmer die Bestellsituation so gestalten, dass der Verbraucher
    mit der Bestellung ausdrücklich bestätigt, sich zu einer Zahlung zu verpflichten.
    Erfolgt die Bestellung über eine Schaltfläche, muss diese gut lesbar mit nichts
    anderem als "zahlungspflichtig bestellen" oder einer entsprechenden eindeutigen
    Formulierung beschriftet sein. Wird diese Vorgabe nicht eingehalten, kommt der
    Vertrag nach § 312j Abs. 4 BGB nicht zustande.

  anspruchskette: >
    § 312j Abs. 3 BGB ist Marktverhaltensregel i. S. d. § 3a UWG ->
    Unterlassungsanspruch § 8 Abs. 1 UWG; Aktivlegitimation der
    Verbraucherzentrale nach § 8 Abs. 3 Nr. 3 UWG.
    Daneben individualvertraglich: § 312j Abs. 4 BGB - der Vertrag kommt
    nicht zustande, gezahlte Beträge sind kondizierbar (§ 812 BGB).
    Für die Verbraucherberatung ist die zweite Ebene praktisch besonders
    relevant, weil sie dem einzelnen Verbraucher unmittelbar hilft.

  signals:
    - order_button_found
    - order_button_label

  # Umgestellt 20.08. auf benannte Listen (_VORLAGE.yaml, Abschnitt LISTEN).
  # So stehen die Formulierungen an einer Stelle und lassen sich pflegen,
  # ohne eine Bedingung anzufassen.
  listen:
    # Zulaessige Formulierungen. Grundlage: EuGH, Urteil vom 07.04.2022,
    # Rs. C-249/21 (Fuhrmann-2) - massgeblich ist allein die Beschriftung
    # der Schaltflaeche, nicht die Begleitumstaende des Bestellvorgangs.
    # Erweitert 20.08.: Die Liste enthielt nur fuenf Eintraege, verglichen
    # wird aber auf vollstaendige Zeichengleichheit. Damit galten der
    # gesetzliche Wortlaut mit einem vorangestellten Adverb und die im
    # Buchungs- und Abonnementbereich uebliche Wortwahl als Verstoss.
    zulaessige_bestell_labels:
      - "zahlungspflichtig bestellen"
      - "jetzt zahlungspflichtig bestellen"
      - "kostenpflichtig bestellen"
      - "jetzt kostenpflichtig bestellen"
      - "zahlungspflichtigen Vertrag schließen"
      - "zahlungspflichtig buchen"
      - "kostenpflichtig buchen"
      - "zahlungspflichtig abonnieren"
      - "kostenpflichtig abonnieren"
      - "kaufen"
      - "jetzt kaufen"

    # In Rechtsprechung und Literatur umstritten. Nicht als eindeutiger
    # Verstoss behandeln, aber zur Pruefung vorlegen.
    umstrittene_bestell_labels:
      - "jetzt bestellen"
      - "Bestellung abschließen"
      - "verbindlich bestellen"
      - "Buchung abschließen"

    # NEU 20.08. (BEFUNDSTUFEN T4). Eine geschlossene Positivliste kann den
    # Negativbeweis nicht fuehren: § 312j Abs. 3 S. 2 BGB laesst ausdruecklich
    # "eine entsprechend eindeutige Formulierung" zu, und keine endliche
    # Liste erfasst alle. "eindeutig" darf deshalb nur aus dieser Liste
    # kommen.
    #
    # Aufnahmekriterium, unmittelbar aus dem Wortlaut: Die Beschriftung
    # enthaelt UEBERHAUPT KEINEN Hinweis auf eine Zahlungverpflichtung. 
    # Eine solche Beschriftung kann unter keiner Lesart eine "entsprechend
    # eindeutige Formulierung" sein. 
    #
    # Wer hier etwas ergaenzt: nur Formulierungen ohne jeden Zahlungsbezug.
    # Alles Uebrige gehoert in die Grauliste.
    unzulaessige_bestell_labels:
      - "Weiter"
      - "Weiter zur Bestellung"
      - "Absenden"
      - "Abschicken"
      - "Bestellung abschicken"
      - "Bestätigen"
      - "Jetzt anmelden"
      - "Anmelden"
      - "Fertig"
      - "OK"

  verdict_rules:
    eindeutig:
      # UMGESTELLT 20.08. (BEFUNDSTUFEN T4). Vorher lautete die Bedingung
      # "steht auf keiner der beiden Listen". Da beide Listen zusammen nur
      # neun Zeichenketten enthielten und auf vollstaendige Gleichheit
      # verglichen wird, war jede andere rechtmaessige Formulierung ein
      # eindeutiger Verstoss - "Zahlungspflichtig buchen", "Kostenpflichtig
      # abonnieren", der gesetzliche Wortlaut mit einem Adverb davor.
      # "eindeutig" kommt jetzt nur noch aus der belegten Negativliste.
      - condition: "order_button_label in unzulaessige_bestell_labels"
        reason: >
          Die Beschriftung der Bestellschaltflaeche enthaelt keinerlei Hinweis
          auf eine Zahlungs- oder Kaufverpflichtung. Sie kann damit auch keine
          "entsprechend eindeutige Formulierung" im Sinne des § 312j Abs. 3
          S. 2 BGB sein.

    verdaechtig:
      - condition: "order_button_label in umstrittene_bestell_labels"
        reason: >
          Die Beschriftung gehoert zu den Formulierungen, deren Eindeutigkeit
          im Sinne des § 312j Abs. 3 BGB umstritten ist.

      # Auffangfall: alles, was auf keiner der drei Listen steht. Bewusst
      # hier und nicht unter "eindeutig" - eine unbekannte Formulierung ist
      # nicht dasselbe wie eine unzulaessige.
      - condition: >
          order_button_label not in zulaessige_bestell_labels and
          order_button_label not in umstrittene_bestell_labels and
          order_button_label not in unzulaessige_bestell_labels
        reason: >
          Die Beschriftung entspricht nicht dem gesetzlichen Wortlaut und ist
          in unseren Listen nicht erfasst. Ob sie eine "entsprechend
          eindeutige Formulierung" darstellt, bedarf der Pruefung.

  threshold_source: >
    EuGH, Urteil vom 07.04.2022, Rs. C-249/21 (Fuhrmann-2 GmbH):
    Für die Beurteilung, ob die Beschriftung den Anforderungen genügt, ist
    ausschließlich der auf der Schaltfläche verwendete Begriff maßgeblich;
    die Begleitumstände des Bestellvorgangs bleiben außer Betracht.
    Diese Entscheidung ist der Grund, warum die Prüfung hier rein
    textbasiert erfolgen darf.

    Die Weißliste enthält die gesetzliche Formulierung und in der Literatur
    unstreitig anerkannte Entsprechungen. Die Grauliste enthält Formulierungen,
    zu denen keine einheitliche Bewertung feststellbar ist.

    OFFEN: "Buchung abschließen" war Gegenstand des Fuhrmann-2-Verfahrens.
    Bitte prüfen, ob die Formulierung dort als unzureichend eingestuft wurde -
    dann gehört sie in die Bewertung "eindeutig" statt in die Grauliste.

  false_positive_risks:
    - >
      Unentgeltliche Angebote: § 312j Abs. 3 BGB gilt nur für entgeltliche
      Verträge. Kostenlose Registrierungen dürfen nicht erfasst werden.
      Abgesichert über "is_b2c_offer" und "has_checkout_flow"; die Erkennung
      ist eine Heuristik und kann fehlgehen.
    - >
      Identifikation der richtigen Schaltfläche: Auf der Bestellseite gibt es
      mehrere Buttons ("Zurück", "Gutschein einlösen"). Erfasst wird nur die
      als Bestellabschluss erkannte Schaltfläche. Wird die falsche erkannt,
      ist der Befund unbrauchbar - deshalb wird die Beschriftung im Wortlaut
      und der Screenshot immer mitgeliefert.
    - >
      B2B-Angebote fallen nicht unter die Vorschrift.
    - >
      Beschriftung als Grafik statt als Text: Dann kann das Signal nicht
      erhoben werden. In diesem Fall soll die Bewertung "unklar" lauten,
      nicht "unauffällig".

  explanation_template_de:
    eindeutig: >
      Die Schaltfläche zum Abschluss der Bestellung trägt die Beschriftung
      „{order_button_label}". Diese Formulierung steht auf der Negativliste
      dieser Regel — sie benennt die Zahlungspflicht nicht und ist auch nicht
      als entsprechend eindeutige Formulierung anerkannt.

      Nach § 312j Abs. 3 BGB muss die Schaltfläche gut lesbar mit nichts
      anderem als „zahlungspflichtig bestellen" oder einer entsprechend
      eindeutigen Formulierung beschriftet sein. Nach EuGH, Urteil vom
      07.04.2022, C-249/21 (Fuhrmann-2), ist dabei allein die Beschriftung
      selbst maßgeblich; die Begleitumstände des Bestellvorgangs bleiben
      außer Betracht.

    verdaechtig: >
      Die Schaltfläche zum Abschluss der Bestellung trägt die Beschriftung
      „{order_button_label}".

      {befund}

      Ob diese Beschriftung eine „entsprechend eindeutige Formulierung" im
      Sinne des § 312j Abs. 3 BGB darstellt, ist nicht abschließend geklärt.
      Der Europäische Gerichtshof hat in der Sache C-249/21 (Fuhrmann-2)
      entschieden, dass allein die Beschriftung maßgeblich ist, die
      Beurteilung der konkreten Formulierung aber dem vorlegenden Gericht
      überlassen. **Mit diesem Befund wird kein Verstoß festgestellt.**

    unklar: >
      Die Beschriftung der Bestellschaltfläche konnte nicht erhoben werden.
      Eine Aussage zur Sache wird nicht getroffen.

  menschliche_pruefung:
    - >
      Handelt es sich um einen Vertrag ueber die Befoerderung von Personen?
      Nach § 312 Abs. 2 Nr. 14 BGB findet auf solche Vertraege von diesem
      Untertitel nur § 312a Abs. 5 Anwendung - § 312j gilt dort NICHT. Bahn,
      Fernbus und Fluglinien fallen damit aus der Regel heraus. Ein Signal
      dafuer gibt es nicht; bei Zielen der Branchen Reise und Ticketing bitte
      vor jedem Befund von Hand ausschliessen.
    - >
      Ist die erfasste Schaltflaeche wirklich die Schaltflaeche zum Abschluss
      der Bestellung? Screenshot gegen die erfasste Beschriftung abgleichen.
    - >
      Pauschalreisevertraege sind NICHT ausgenommen: § 312 Abs. 6 BGB
      erklaert ausdruecklich § 312j Abs. 2 bis 5 fuer anwendbar. Kein
      Handlungsbedarf, hier nur zur Klarstellung vermerkt.

  offene_fragen:
    - >
      Wie wurde "Buchung abschließen" in Rs. C-249/21 konkret bewertet?
      Danach richtet sich die Einordnung in Weiß-, Grau- oder Schwarzliste.
    - >
      Sollten wir eine ausdrückliche Schwarzliste ergänzen ("Anmelden",
      "Weiter", "Absenden", "Jetzt starten")? Vorteil: klarere Begründung
      im Bericht. Nachteil: Weißlistenprüfung erfasst diese Fälle bereits.
    - >
      Wie behandeln wir mehrsprachige Seiten mit englischer Beschriftung
      ("Buy now") bei deutschsprachigem Angebot?

  disclaimer_required: true
