# Bitte als Vorlage für den eigenen Stil lesen.
# ============================================================

- id: DP-001
  name_de: "Ungleiche Gestaltung der Consent-Buttons"

  # Kategorie nach dem Raster der Verbraucherzentrale (19.08.):
  # Zeitdruck | Zwang | Hindernisse | Irrefuehrung
  # -- Vorbelegung durch das Entwicklungsteam, bitte pruefen --
  kategorie: "Zwang"

  status: REVIEW
  bearbeiter: "Jura-Team"

  # Umgestellt 20.08. Vorher stand hier nur "banner_detected == true".
  # Damit fiel der schwerste Fall aus dem Bericht: eine Seite, die GAR KEIN
  # Einwilligungsbanner zeigt und trotzdem Drittanbieter-Cookies setzt. Sie
  # galt als "nicht anwendbar" und verschwand - obwohl dort schon keine
  # Einwilligung im Sinne des § 25 Abs. 1 TDDDG vorliegt. Dieselbe Art
  # Fehler wie in DP-006 (Voraussetzung invertiert).
  #
  # Ohne Banner UND ohne Drittanbieter-Cookies greift die Regel weiterhin
  # nicht - dann ist nichts zu beanstanden.
  applies_when:
    any:
      - "banner_detected == true"
      - "third_party_cookies_before_consent > 0"

  legal_basis:
    - "§ 25 Abs. 1 TDDDG (Einwilligung für Zugriff auf Endeinrichtungen)"
    - "Art. 4 Nr. 11 DSGVO (Begriff der Einwilligung)"
    - "Art. 7 Abs. 4 DSGVO (Freiwilligkeit)"
    - "ErwG 32 DSGVO (keine Einwilligung durch vorangekreuzte Kästchen)"
    - "ErwG 42 DSGVO (echte Wahlmöglichkeit, Ablehnung ohne Nachteil)"

  tatbestand_de: >
    Der Zugriff auf Informationen in der Endeinrichtung des Nutzers setzt eine
    Einwilligung voraus, die den Anforderungen der DSGVO genügt. Eine Einwilligung
    ist nur wirksam, wenn sie freiwillig erteilt wird. Freiwilligkeit setzt eine
    echte Wahlmöglichkeit voraus; die Ablehnung darf nicht spürbar erschwert sein.
    Vorangekreuzte Kästchen und bloße Untätigkeit stellen keine Einwilligung dar.

  anspruchskette: >
    Verstoß gegen § 25 TDDDG / Art. 7 DSGVO -> zugleich Marktverhaltensregel
    i. S. d. § 3a UWG (str., aber überwiegend bejaht) -> Unterlassungsanspruch
    § 8 Abs. 1 UWG; Aktivlegitimation der Verbraucherzentrale nach
    § 8 Abs. 3 Nr. 3 UWG bzw. § 2 UKlaG. Ergänzend: Verbandsklagebefugnis bei
    DSGVO-Verstößen bestätigt durch EuGH, Rs. C-319/20 (Meta Platforms Ireland).

  signals:
    - banner_detected
    - accept_button_area_px2
    - reject_button_area_px2
    - reject_button_present
    - reject_click_depth
    - accept_contrast_ratio
    - reject_contrast_ratio
    - preselected_checkbox_count
    - third_party_cookies_before_consent
    - banner_reappears_on_reject
    - banner_reappears_count_24h
    - more_info_present
    - more_info_leads_to_reject
    - more_info_click_depth

  verdict_rules:
    eindeutig:
      # Vorangekreuzte Einwilligungen - unmittelbar von ErwG 32 erfasst,
      # bestätigt durch EuGH Planet49 (C-673/17) und BGH I ZR 7/16.
      - "preselected_checkbox_count > 0"
      # Tracking vor jeder Interaktion. Unabhängig von der Gestaltung:
      # es liegt schon keine Einwilligung vor.
      #
      # Schwelle 20.08. von "> 0" auf "> 1" angehoben. Ein einzelnes
      # Drittanbieter-Cookie kann ein CDN oder eine eingebettete Schrift
      # sein; § 25 Abs. 2 TDDDG nimmt technisch notwendige Speicherung aus.
      # Die eigenen Fehlalarmrisiken dieser Regel verlangen bei genau einem
      # Cookie ausdruecklich eine manuelle Pruefung - dann darf die Regel
      # dort nicht die staerkste Stufe behaupten. Der Einzelfall steht jetzt
      # eine Stufe tiefer.
      - "third_party_cookies_before_consent > 1"
      # Kein Banner, aber Zugriff auf die Endeinrichtung: Es gibt schon
      # keinen Mechanismus, ueber den eine Einwilligung haette erteilt
      # werden koennen. § 25 Abs. 1 TDDDG; die Ausnahme fuer technisch
      # notwendige Speicherung (Abs. 2) bleibt im Einzelfall zu pruefen.
      - "banner_detected == false and third_party_cookies_before_consent > 0"
      # Keine Ablehnmoeglichkeit ueberhaupt = keine echte Wahl.
      # Nach legal_note_on_more_info ist ein Banner mit nur "Zustimmen" und
      # "Mehr Informationen" unzulaessig, WENN der zweite Weg nicht zu einer
      # unmittelbaren Ablehnung fuehrt. Genau das steht jetzt hier; der
      # Fall, dass er dorthin fuehrt, steht als Verdachtsmoment unten.
      - "banner_detected == true and reject_button_present == false and more_info_leads_to_reject == false"
      # Wiederholtes sofortiges Wiedererscheinen innerhalb 24h in Kombination mit
      # fehlender klarer Ablehnungsoption ist ein starker Indikator.
      - "banner_reappears_count_24h >= 2"

    verdaechtig:
      # Genau ein Drittanbieter-Cookie vor der Einwilligung: auffaellig,
      # aber im Einzelfall technisch erklaerbar (siehe Fehlalarmrisiken).
      - "third_party_cookies_before_consent == 1"
      # Ablehnung nur ueber die zweite Ebene ("Mehr Informationen").
      # Moeglich, aber spuerbar erschwert - Art. 7 Abs. 4 DSGVO.
      - "banner_detected == true and reject_button_present == false and more_info_leads_to_reject == true"
      # Ablehnung erfordert zusätzliche Schritte, Zustimmung nicht.
      - "reject_click_depth > 1"
      # Deutlicher Größenunterschied.
      - "accept_button_area_px2 / reject_button_area_px2 > 2.0"
      # Visuelle Zurücksetzung der Ablehnung.
      - "accept_contrast_ratio - reject_contrast_ratio > 3.0"
      # Banner erscheint nach Ablehnung wieder (nagging) -> verdächtig
      - "banner_reappears_on_reject == true"
      # 'Mehr Informationen' führt zu Ablehnung, aber erst nach mehreren Schritten
      - "more_info_present == true and more_info_leads_to_reject == true and more_info_click_depth > 1"

  threshold_source: >
    Zu "preselected_checkbox_count" und "third_party_cookies_before_consent":
    ErwG 32 DSGVO ausdrücklich; EuGH Planet49 (C-673/17); BGH Cookie-Einwilligung II
    (I ZR 7/16). Insoweit keine eigene Festlegung erforderlich.

    Zu den Werten 2.0 (Flächenverhältnis) und 3.0 (Kontrastdifferenz):
    Keine bezifferte Rechtsprechungsgrundlage ersichtlich. Eigene Festlegung des
    Teams, orientiert an EDPB Guidelines 03/2022 on Deceptive Design Patterns,
    die ungleiche Hervorhebung von Auswahlmöglichkeiten als problematisch
    einordnen, ohne Zahlenwerte zu nennen. Faktor 2,0 bewusst konservativ
    gewählt: geringere Unterschiede sollen keinen Befund auslösen.
    Der Kontrastwert folgt der WCAG-Skala (1 bis 21).

  false_positive_risks:
    - >
      Responsive Gestaltung: Bei schmalem Fenster stehen Buttons untereinander
      und haben andere Flächenverhältnisse. Gegenmaßnahme: feste Fenstergröße
      bei der Erfassung, Dokumentation im Bericht.
    - >
      "Einstellungen" ist nicht immer ein Ablehnen-Button. Führt der Weg dort
      zu einer echten Ablehnung mit einem weiteren Klick, ist die Bewertung
      milder anzusetzen als bei drei Ebenen.
    - >
      Technisch notwendige Cookies dürfen ohne Einwilligung gesetzt werden
      (§ 25 Abs. 2 TDDDG). Das Signal zählt nur Drittanbieter-Cookies, dennoch
      sind Einzelfälle denkbar (z. B. externes CDN). Bei genau einem Cookie
      sollte manuell geprüft werden.
    - >
      Consent Management Plattformen liefern je nach Region unterschiedliche
      Banner aus. Der Erfassungsort wird im Bericht mitgeführt.

  explanation_template_de: >
    Auf der untersuchten Seite wurde ein Einwilligungsbanner festgestellt.
    Der Zustimmen-Button umfasst {accept_button_area_px2} px², der
    Ablehnen-Button {reject_button_area_px2} px². Die vollständige Ablehnung
    erfordert {reject_click_depth} Interaktionsschritte, die Zustimmung einen.
    Vorausgewählte Auswahlfelder: {preselected_checkbox_count}.
    Vor jeder Interaktion wurden {third_party_cookies_before_consent}
    Drittanbieter-Cookies gesetzt.

    Diese Gestaltung wirft die Frage auf, ob die Einwilligung im Sinne des
    Art. 4 Nr. 11 i. V. m. Art. 7 Abs. 4 DSGVO freiwillig erteilt wurde.

  offene_fragen_resolved:
    - question: "Ist § 25 TDDDG als Marktverhaltensregel i. S. d. § 3a UWG anerkannt?"
      answer: >
        Ja. Während die Frage früher (u. a. im BGH-Verfahren ‚App‑Zentrum‘) dem EuGH zur Entscheidung vorgelegt
        wurde, hat der EuGH in der Rechtssache (u. a. 'Lindenapotheke') die Möglichkeit einer wettbewerbsrechtlichen
        Geltendmachung von Datenschutzverstößen bejaht; der BGH hat diese Sicht übernommen und damit für Deutschland
        bestätigt, dass auch Datenschutzvorschriften (insb. informations‑ und zustimmungsrechtliche Pflichten)
        als Marktverhaltensregeln i.S.d. Lauterkeitsrechts gelten können. OLG‑Entscheidungen (u. a. OLG Köln GRUR-RR 2024, 341)
        sehen § 25 TDDDG ausdrücklich als Marktverhaltensregel. Insgesamt ist damit die Auffassung vorherrschend,
        dass Verstöße gegen § 25 TDDDG wettbewerbsrechtlich verfolgt werden können.
      implications: >
        Folge: Qualifizierte Verbraucherschutz‑einrichtungen bzw. Wettbewerber können Verstöße nach § 25 TDDDG
        unter Berufung auf das Lauterkeitsrecht geltend machen; Aktivlegitimation besteht insbesondere nach
        § 8 Abs. 3 Nr. 3 UWG (und den einschlägigen UKlaG‑Vorschriften).
      sources:
        - "BGH: Verweis/Grundsatzdiskussion 'App-Zentrum' (vgl. BGH GRUR 2020, 896 Rn. 33 ff.)"
        - "EuGH: 'Lindenapotheke' (EuGH GRUR-RS 2024, 26048) – wettbewerbsrechtliche Klagemöglichkeit bei DSGVO-Verstößen bestätigt"
        - "BGH Folgeentscheidung zur Bestätigung (BGH GRUR-RS 2025, 5877)"
        - "OLG Köln: §25 TDDDG als Marktverhaltensregel (GRUR-RR 2024, 341)"
        - "Literatur/Kommentierung: BeckOK UWG/Niebel/Bauer/Kerl, §3a Rn.70a (Stand 1.5.2026)"
    - question: "Soll 'banner_reappears_on_reject' (nagging) aufgenommen werden?"
      answer: >
        Ja. EDPB‑Guidelines zu Dark Patterns, nationale DPA‑Hinweise (z. B. CNIL/ICO) und die jüngere Rechtsprechung sehen
        wiederholte oder drängende Nachfragen nach Ablehnung als Indiz für nicht 'freiwillig' erteilte Zustimmung.
        Die Relevanz hängt von Frequenz und Kontext ab; wiederholtes unmittelbares Wiedererscheinen bzw. mehrfache
        Aufforderungen innerhalb kurzer Zeit (z. B. >1 innerhalb 24h oder sofort nach Klick 'ablehnen') sind ernsthaft
        verdächtig und sollten mindestens eine manuelle Prüfung auslösen; bei Kombination mit anderen Indikatoren
        (kein Ablehnen auf erste Ebene, vorab gesetzte Drittanbieter-Cookies, voreingestellte Häkchen) kann dies
        zum eindeutigen Befund führen.
      sources:
        - "EDPB Guidelines 03/2022 (Dark Patterns)"
        - "CNIL / ICO guidance on cookies and nagging banners"
        - "Rechtsprechung und Praxiskommentare (siehe Quellen oben)"
    - question: "Wie mit Bannern verfahren, die nur 'Akzeptieren' und 'Mehr Informationen' anzeigen?"
      answer: >
        Nach den Entscheidungen und Kommentaren (insb. GRUR-RR 2024, 341 Rn.21 sowie LG‑Erwägungen) ist eine solche
        Gestaltung regelmäßig problematisch: Wird auf der ersten Ebene keine klare Ablehnungsoption angeboten und
        führt 'Mehr Informationen' nicht unmittelbar (one‑click) zu einer gleichwertigen Ablehnungswahl, so ist die
        Einwilligung typischerweise nicht als freiwillig i.S.v. § 25 I TTDSG / Art. 4 Nr. 11 DSGVO anzusehen.
        Praktische Regel: Wenn 'more_info_leads_to_reject' == false oder 'more_info_click_depth' > 1 → mindestens 'verdaechtig';
        keine Ablehnungsoption auf erster Ebene oder unklare Beschriftung → tendenziell 'eindeutig'.
      sources:
        - "GRUR-RR 2024, 341 Rn.21 (OLG Köln – Ausführungen zur fehlenden Ablehnungsoption und zur Irreführung des Durchschnittsnutzers)"
        - "BGH/EuGH‑Leitentscheidungen und Literatur (s.o.)"

  legal_note_on_more_info: >
    EDPB guidance and national DPAs require that refusal of non-essential processing
    be at least as easy as acceptance. Banners offering only 'Accept' + 'More information'
    are problematic unless the 'More information' path provides an immediate, single-click
    way to refuse. Absent such a path, consent may be invalid (see EDPB Guidelines and CNIL/ICO guidance).

  disclaimer_required: true
