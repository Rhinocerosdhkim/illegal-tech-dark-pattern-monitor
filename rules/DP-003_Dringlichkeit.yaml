# ============================================================
# ENTWURF - bitte vervollständigen
#
# Kernidee dieser Regel: Ein Countdown ist nicht per se unzulässig.
# Unlauter ist die UNWAHRE Behauptung zeitlicher Begrenzung.
# Den Nachweis der Unwahrheit führen wir technisch, indem wir die
# Seite nach Löschen aller Browserdaten erneut aufrufen und prüfen,
# ob der Countdown auf denselben Startwert zurückspringt.
#
# Das ist unser stärkstes Argument für Automatisierung: Ein Mensch
# müsste diese Prüfung für jede Seite einzeln wiederholen.
# ============================================================

- id: DP-003
  name_de: "Vorgetäuschte zeitliche Begrenzung und Knappheit"

  # Kategorie nach dem Raster der Verbraucherzentrale (19.08.):
  # Zeitdruck | Zwang | Hindernisse | Irrefuehrung
  kategorie: "Zeitdruck"

  status: REVIEW
  bearbeiter: "Jura-Team"

  applies_when:
    - "is_b2c_offer == true"

  legal_basis:
    - "§ 3 Abs. 3 iVm Anhang zu § 3 Abs. 3 UWG Nr. 7 (unwahre Angabe zeitlicher Begrenzung)"
    - "§ 5 Abs. 1 UWG (irreführende geschäftliche Handlung) — subsidiär, wenn keine Einordnung in die Schwarzen Liste möglich ist"
    - "§ 8 UWG (Unterlassungs-/Beseitigungsanspruch)"
    - "§ 8 Abs. 3 UWG (Aktivlegitimation: Wettbewerber, qualifizierte Verbraucherverbände)"

  tatbestand_de: >
    Gegenüber Verbrauchern ist die unwahre Angabe, bestimmte Waren oder 
    Dienstleistungen seien allgemein oder zu bestimmten Bedingungen nur für 
    einen sehr begrenzten Zeitraum verfügbar, um den Verbraucher zu einer 
    sofortigen geschäftlichen Entscheidung zu veranlassen, ohne dass dieser 
    Zeit und Gelegenheit hat, sich auf Grund von Informationen zu entscheiden, 
    stets unzulässig.

  anspruchskette: >
    Unlautere geschäftliche Handlung gemäß Anhang zu § 3 Abs. 3 Nr. 7 UWG (Schwarze Liste)
    → Verstoß gegen § 3 Abs. 3 UWG 
    → Unterlassungsanspruch nach § 8 Abs. 1 UWG, ggf. auch Beseitigung nach
    § 8 Abs. 1 S. 2 UWG.
    Aktivlegitimation der Verbraucherzentrale nach § 8 Abs. 3 Nr. 3 UWG.

  signals:
    # Countdown-Muster
    - countdown_element_present
    - countdown_resets_on_revisit
    - countdown_text
    - countdown_initial_value_seconds

    # Knappheits-Muster
    - scarcity_text_present
    - scarcity_value
    - scarcity_value_unchanged_scans

  verdict_rules:
    eindeutig:
      - "countdown_element_present == true and countdown_resets_on_revisit == true"
      - "scarcity_text_present == true and scarcity_value > 0 and scarcity_value_unchanged_scans >= 3"
    verdaechtig:
      # GESTRICHEN 20.08.: "countdown_element_present == true and
      # countdown_resets_on_revisit != true". Sie haette bei JEDEM Countdown
      # ausgeloest - auch bei Sitzungs- und Zahlungsfristen, die die eigenen
      # Fehlalarmrisiken dieser Regel ausdruecklich ausnehmen wollen, und
      # entgegen dem eigenen threshold_source, der einen reproduzierbaren
      # Befund verlangt, dass die behauptete Begrenzung nicht besteht.
      # Der Fall ist ohnehin abgedeckt: springt der Countdown zurueck, greift
      # "eindeutig"; springt er nicht zurueck, ist er echt; laesst es sich
      # nicht messen, entsteht "unklar" von selbst.
      #
      # GESTRICHEN 20.08.: "scarcity_text_present == true and
      # scarcity_value == 0". Ein Knappheitshinweis ohne lesbare Zahl
      # ("nur noch wenige verfuegbar") liefert 0 - damit wurde eine
      # Messluecke als Befund gewertet. Ist keine Zahl vorhanden, gehoert
      # scarcity_value nach signal_errors (siehe _SIGNALE.md).
      - "scarcity_text_present == true and scarcity_value_unchanged_scans >= 2"

  threshold_source: >
    Wortlaut Anlage Nr. 7 zu § 3 Abs. 3 UWG: die unwahre Angabe einer zeitlichen
    Begrenzung ist als unlautere geschäftliche Handlung ausdrücklich genannt.
    Für den Befund der "Unwahrheit" ist keine numerische Schwelle gesetzlich
    vorgegeben; es handelt sich um einen qualitativen Rechtsbegriff.

    Technische Festlegung (Teamentscheidung): Für den Countdown genügt
    ein reproduzierbarer Befund, dass die behauptete Begrenzung technisch
    nicht gegeben ist (z. B. Reset auf denselben Startwert nach Löschen von
    Cookies/localStorage). Für Knappheitsangaben (angegebene Stückzahl)
    empfehlen wir als praktischen Schwellenwert mindestens 3 voneinander
    unabhängige Messungen, um legitime, kurzzeitige Bestandsänderungen
    oder Messfehler auszuschließen. Diese Zählgrenze ist eine technische
    Vorsichtsmaßnahme zur Minimierung von False Positives, nicht eine
    materielle Voraussetzung des rechtlichen Tatbestands.

  false_positive_risks:
    - >
      Personalisierte zeitbegrenzte Angebote („24 Std. ab Registrierung"),
      die sich für jeden Nutzer korrekt zurücksetzen: Messungen müssen im
      nicht angemeldeten Zustand erfolgen oder nur auf nicht‑personalisierten
      Werbeaussagen angewendet werden.
    - >
      Legitimer betrieblicher Countdown (z. B. Ablauf einer Sitzung, Checkout‑Token)
      oder technische Hinweise (z. B. verbleibende Zeit zur Zahlung): solche
      funktionalen Countdowns sind zulässig und sollten durch Kontextindikatoren
      (z. B. Label „Sitzung verbleibend", Hinweis auf Sicherheitsfunktion)
      ausgenommen werden.
    - >
      Echtes, sich häufig änderndes Inventar (z. B. Lagerbestände, dynamische
      Restmengen): Kurzfristige Veränderungen sind plausibel. Gegenmaßnahme:
      mehrere Messungen über einen längeren Zeitraum / andere Indikatoren prüfen.
    - >
      Gezielte Angebote nach Geolocation oder A/B‑Testing: Tests müssen die
      richtige Geokonfiguration und ggf. Varianten beachten.
    - >
      Caching/CDN‑Effekte oder CDN‑seitige Headers: Tests sollen mit gelöschtem
      Browser‑Status und, falls möglich, weiterer Session/-IP‑Variation
      wiederholt werden, um Messfehler zu reduzieren.

  explanation_template_de: >
    Befund: Auf der untersuchten Seite wurde eine Angabe zur zeitlichen Begrenzung
    festgestellt („{countdown_text}" / {scarcity_value} falls vorhanden). Nach
    Wiederholung der Messung in einer frischen Browser‑Session (Cookies/localStorage
    gelöscht) {countdown_resets_on_revisit,  default: 'wurde festgestellt, dass der Countdown auf denselben Startwert zurückspringt'}.
    Dies legt nahe, dass die behauptete zeitliche Begrenzung nicht real besteht
    und vielmehr künstlicher Zeitdruck erzeugt wird.

    Rechtsbewertung: Die unwahre Angabe einer zeitlichen Begrenzung ist in
    Anlage Nr. 7 zu § 3 Abs. 3 UWG als stets unzulässige geschäftliche Handlung
    genannt. Liegt eine solche unlautere Handlung vor, begründet dies in der Regel
    Unterlassungs‑ und Beseitigungsansprüche nach § 8 UWG. Detailbelege (Screenshots,
    DOM‑Hashes, Request/Response‑Header) sind diesem Bericht beigefügt.

  offene_fragen:
    - "Reicht aus Sicht der Rechtsabteilung ein einziger reproduzierbarer Reset des Countdowns (nach Löschen der Browserdaten) als gerichtsfester Nachweis der Unwahrheit, oder sollen wir 2–3 unabhängige Messungen (z. B. verschiedene IPs/Times) vorschreiben? (Vorschlag: 2–3 Messungen.)"
    - "Sollen wir in die Regel aufgenommene Ausnahmen explizit benennen (z. B. Session/Checkout‑Timeouts, technisch begründete Countdowns)?"
    - "Wie streng wollen wir mit Formulierungen wie 'X Personen sehen sich das gerade an' verfahren — Nr. 7 UWG oder § 5 UWG? (Vorschlag: 'viewer_count_present' zunächst unter § 5 UWG prüfen, bei manipulativer Reproduktion ggf. Nr.7.)"
    - "Welche zusätzlichen Belege sind gewünscht, um ein gerichtsfestes Paket zu erzeugen (z. B. vollständige Set‑Cookie‑Listen, Server‑Response‑Headers, Zeitstempelscreenshots)?"
    - "Soll die Mindestanzahl von Confirmations‑Scans (bei Knappheit) konfigurierbar bleiben oder fest in die Regel geschrieben werden?"

  disclaimer_required: true
