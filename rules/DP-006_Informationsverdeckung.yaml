- id: DP-006
  name_de: "Verdeckung wesentlicher Pflichtinformationen"

  kategorie: "Irrefuehrung"

  status: REVIEW
  bearbeiter: "Jura-Team"

  # Umgestellt 20.08. "required_info_found == true" stand hier als
  # Voraussetzung. Damit fiel der schlimmste Fall, den diese Regel ueberhaupt
  # erfassen soll, stillschweigend heraus: Eine Seite, die die
  # Pflichtinformation gar nicht enthaelt oder so gruendlich verbirgt, dass
  # die Stichwortsuche sie nicht findet, galt als "nicht anwendbar" und
  # verschwand aus dem Bericht. Das Merkmal gehoert nicht in die
  # Anwendbarkeit, sondern in die Befundbedingungen - dort steht es jetzt.
  # Ergaenzt 20.08. is_b2c_offer allein ist eine Heuristik ueber Preisangaben
  # und stellt weder ein Angebot im Sinne des § 5b Abs. 1 UWG ("Werden Waren
  # oder Dienstleistungen unter Hinweis auf deren Merkmale und Preis
  # angeboten") noch einen Transaktionsbezug fest. Dieselbe Ergaenzung, die
  # DP-004 am selben Tag bekommen hat.
  applies_when:
    all:
      - "is_b2c_offer == true"
      - "has_price_display == true"
      - "order_button_found == true"

  legal_basis:
    - "§ 5a Abs. 1 UWG (Vorenthalten wesentlicher Informationen)"
    - "§ 5a Abs. 2 UWG (Verheimlichen sowie unklare, unverständliche oder zweideutige Bereitstellung)"
    - "§ 5a Abs. 3 UWG (Berücksichtigung räumlicher und zeitlicher Beschränkungen)"
    - "§ 5b Abs. 1 UWG (wesentliche Informationen bei Aufforderung zum Kauf)"
    - "§ 312d Abs. 1 BGB i. V. m. Art. 246a EGBGB (Informationspflichten im Fernabsatz)"
    - "§ 3a UWG (Rechtsbruch)"
    - "§ 8 Abs. 1, Abs. 3 Nr. 3 UWG (Beseitigungs- und Unterlassungsansprüche)"

  tatbestand_de: >
    Nach § 5a Abs. 1 UWG ist eine wesentliche Information vorenthalten,
    wenn sie der Verbraucher für eine informierte geschäftliche
    Entscheidung benötigt und das Vorenthalten geeignet ist, ihn zu
    einer anderen geschäftlichen Entscheidung zu veranlassen. Nach
    § 5a Abs. 2 UWG steht dem Vorenthalten insbesondere das Verheimlichen,
    die unklare, unverständliche oder zweideutige Darstellung sowie die
    nicht rechtzeitige Bereitstellung gleich. Eine Information kann daher
    trotz technischer Existenz als vorenthalten in Betracht kommen, wenn
    sie durch die konkrete Gestaltung faktisch nicht oder nur schwer
    wahrnehmbar ist. Schriftgröße, Kontrast, Opazität, Position,
    eingeklappte Inhalte und der Zeitpunkt der Bereitstellung können
    hierfür technische Indizien sein. Die konkrete Wesentlichkeit und
    rechtliche Bewertung bleibt der menschlichen Prüfung vorbehalten.

  anspruchskette: >
    § 5a UWG setzt voraus, dass eine wesentliche Information vorenthalten
    wird und dies geeignet ist, die geschäftliche Entscheidung des
    Verbrauchers zu beeinflussen. Bei Aufforderungen zum Kauf bestimmt
    § 5b Abs. 1 UWG einen Katalog wesentlicher Informationen, insbesondere
    wesentliche Merkmale, Identität und Anschrift des Unternehmers sowie
    Gesamtpreis und gegebenenfalls zusätzliche Kosten. Bei Fernabsatz-
    verträgen bestehen ergänzende Informationspflichten nach § 312d Abs. 1
    BGB i. V. m. Art. 246a EGBGB. Ein Verstoß gegen eine entsprechende
    Marktverhaltensregel kann nach § 3a UWG unlauter sein; daraus können
    insbesondere Unterlassungs- und Beseitigungsansprüche nach § 8 Abs. 1
    UWG folgen, die nach § 8 Abs. 3 Nr. 3 UWG auch von qualifizierten
    Verbraucherverbänden geltend gemacht werden können.

  signals:
    # ACHTUNG: Einige der folgenden Namen stehen noch nicht in _SIGNALE.md.
    # Welche davon zugesagt, ersetzt oder gestrichen werden, klaert
    # docs/ABSTIMMUNG_Regelwerk.md. Bis dahin nicht lauffaehig.
    - required_info_found
    - required_info_type
    - font_size_min_px
    - text_contrast_min
    - hidden_by_opacity_count
    - scroll_depth_of_required_info_pct
    - required_info_in_collapsed_element
    - aria_hidden_on_required_info
    - required_info_visible_before_purchase_decision

  listen:
    # Auf welche Pflichtinformation es ankommt. Ein Impressum in der
    # Fusszeile ist der vom Gesetz selbst vorgesehene Ort (§ 5 Abs. 1 DDG:
    # "leicht erkennbar, unmittelbar erreichbar und staendig verfuegbar") -
    # es dort zu finden, ist kein Verdachtsmoment. Die weichen Indizien
    # greifen deshalb nur bei transaktionsbezogenen Pflichtangaben.
    transaktionsbezogene_pflichtinfos:
      - "Widerruf"
      - "Widerrufsbelehrung"
      - "Gesamtpreis"
      - "Lieferkosten"
      - "Versandkosten"
      - "Liefer- und Versandkosten"

  verdict_rules:
    # Bewusst KEINE Stufe "eindeutig". § 5a Abs. 1 UWG verlangt, dass die
    # Information WESENTLICH ist und dass ihr Vorenthalten geeignet ist, den
    # Verbraucher zu einer anderen geschaeftlichen Entscheidung zu
    # veranlassen. Beides ist aus einem Screenshot nicht feststellbar.

    verdaechtig:
      # --- Strukturelle Verbergung: traegt jeweils fuer sich -------------
      # Ein aktives Verheimlichen im Sinne des § 5a Abs. 2 UWG, nicht bloss
      # eine ungluenstige Darstellung.
      - "hidden_by_opacity_count > 0"
      - "required_info_in_collapsed_element == true"
      - "aria_hidden_on_required_info == true"

      # --- Weiche Indizien -----------------------------------------------
      # UMGESTELLT 20.08., zum zweiten Mal. Zuerst loesten Schriftgroesse,
      # Kontrast und Scrolltiefe EINZELN aus; danach paarweise. Auch die
      # Paare loesten noch auf allen fuenf Vergleichsseiten aus, weil die
      # Scrolltiefe als Paarhaelfte nichts beitraegt: eine Pflichtangabe in
      # der Fusszeile liegt definitionsgemaess unten, der Wert ist bei dieser
      # Sachlage praktisch immer ueber 75. Zwei der drei Paare waren damit
      # die alten Einzelbedingungen in Verkleidung.
      #
      # Geblieben ist eine Bedingung, die beide typografischen Merkmale
      # zugleich verlangt, und zwar unterhalb JEDER WCAG-Stufe - auch der
      # 3:1 fuer grosse Schrift. Die Scrolltiefe wird nur noch als Nachweis
      # mitgefuehrt, nicht mehr bewertet.
      - condition: >
          font_size_min_px < 10 and
          text_contrast_min < 3.0 and
          required_info_type in transaktionsbezogene_pflichtinfos
        reason: >
          Schriftgröße und Kontrast der Pflichtinformation unterschreiten
          zugleich deutlich das, was technisch als lesbar gilt. Das ist ein
          Anhaltspunkt für eine unklare Bereitstellung im Sinne des
          § 5a Abs. 2 Nr. 2 UWG — für sich allein kein Verstoß.

      # AUSKOMMENTIERT 20.08. "required_info_visible_before_purchase_decision"
      # steht in _SIGNALE.md unter "Zurueckgestellt mit DP-005b" (⚪), mit dem
      # ausdruecklichen Hinweis, keine Regel darauf zu bauen. Eine AKTIVE
      # Bedingung auf einem solchen Signal setzt DP-006 auf jeder realen
      # Seite auf "unklar" - die Regel koennte dann nie "unauffaellig" sagen.
      # - "required_info_visible_before_purchase_decision == false"

    unklar:
      # VERSCHOBEN 20.08. von "verdaechtig". Am Vormittag war das Merkmal aus
      # applies_when herausgenommen worden, weil dort der schwerste Fall
      # stillschweigend herausfiel. Der Landeplatz "verdaechtig" war aber
      # eine Stufe zu weit: Wir suchen ueber Stichworte auf drei bis vier
      # Seiten. Ein negativer Treffer sagt etwas ueber unsere Suche, nicht
      # ueber die Seite (T3). § 5a Abs. 3 Nr. 2 UWG verlangt zudem
      # ausdruecklich, andere Wege der Bereitstellung zu beruecksichtigen -
      # die sieht unsere Erfassung nicht.
      #
      # Der Fall verschwindet dadurch NICHT aus dem Bericht: "unklar" ist
      # berichtsrelevant. Genau das war die Sorge bei der ersten Korrektur.
      - condition: "required_info_found == false"
        reason: >
          Die Pflichtinformation ließ sich auf dem erfassten Pfad über die
          Stichwortsuche nicht auffinden. Das ist kein Befund, sondern eine
          offene Frage: § 5a Abs. 3 Nr. 2 UWG verlangt, andere Wege der
          Bereitstellung zu berücksichtigen, und die sieht die Erfassung
          nicht. Bitte manuell nachprüfen.

  threshold_source: >
    Zu den Werten 10 px und 3,0: eigene Festlegung des Teams, bewusst
    unterhalb jeder Stufe der WCAG 2.2. Erfolgskriterium 1.4.3 verlangt fuer
    normalen Text 4,5:1, fuer grosse Schrift dagegen nur 3:1; Logos,
    dekorative und inaktive Elemente sind ausgenommen. Da unsere Signale
    jeweils das MINIMUM ueber einen ganzen Bereich sind, unterschreitet auch
    eine vollstaendig WCAG-konforme Seite den Wert 4,5 - eine graue
    Unterzeile oder ein Wortmarken-Logo genuegt. 4,5 taugt daher nicht als
    Warnschwelle fuer ein Blockminimum. Es handelt sich ausdruecklich um
    technische Warnschwellen und nicht um rechtliche Grenzwerte.

    Das Gesetz enthält keine festen Schwellenwerte für Schriftgröße,
    Kontrast, Opazität oder Scrolltiefe. Die genannten Werte sind daher
    ausschließlich technische Warnschwellen und keine rechtlichen
    Grenzwerte. Für den Kontrast kann WCAG 2.2 AA als technischer
    Referenzmaßstab herangezogen werden; dort gilt für normalen Text
    grundsätzlich ein Kontrastverhältnis von 4,5:1. Die Unterschreitung
    dieses Wertes begründet für sich allein keinen Verstoß gegen § 5a UWG.
    Eine hohe Scrolltiefe oder ein eingeklappter Bereich ist ebenfalls
    nicht automatisch unzulässig. Entscheidend bleibt die konkrete
    Wahrnehmbarkeit, Verständlichkeit und Rechtzeitigkeit der Information.

  false_positive_risks:
    - >
      Die Erkennung einer Information über Stichworte beweist nicht,
      dass die gesuchte Pflichtinformation tatsächlich vollständig und
      inhaltlich zutreffend vorhanden ist.
    - >
      Eingeklappte Bereiche sind nicht per se unzulässig. Entscheidend
      ist, ob die Information dadurch im konkreten Fall unklar,
      unverständlich oder faktisch schwer auffindbar wird.
    - >
      Eine Platzierung in der Fußzeile oder außerhalb des initialen
      Sichtbereichs ist nicht automatisch unzulässig.
    - >
      Niedriger Kontrast, geringe Schriftgröße oder hohe Scrolltiefe
      sind keine eigenständigen lauterkeitsrechtlichen Verstöße.
    - >
      Eine Information kann unter Umständen auf anderem Wege
      bereitgestellt worden sein; dies muss bei der menschlichen
      Prüfung berücksichtigt werden.

  explanation_template_de:
    verdaechtig: >
      {befund}

      Gemessen wurde im Bereich der Pflichtinformation: geringste
      Schriftgröße {font_size_min_px} px, geringster Kontrast
      {text_contrast_min}, Position bei {scroll_depth_of_required_info_pct} %
      der Seitenhöhe.

      § 5a Abs. 1 UWG setzt voraus, dass die Information wesentlich ist und
      dass ihr Vorenthalten geeignet ist, den Verbraucher zu einer anderen
      geschäftlichen Entscheidung zu veranlassen. Beides ist technisch nicht
      feststellbar und bleibt der rechtlichen Prüfung vorbehalten. Nach
      § 5a Abs. 3 UWG sind zudem räumliche oder zeitliche Beschränkungen des
      Kommunikationsmittels zu berücksichtigen. **Mit diesem Befund wird kein
      Verstoß festgestellt.**

    unklar: >
      {befund}

    "*": >
      Zu dieser Regel konnten nicht alle benötigten Messwerte erhoben werden.

  offene_fragen:
    - >
      Zu den zu erfassenden Pflichtinformationen gehören insbesondere
      wesentliche Merkmale, Identität und Anschrift des Unternehmers,
      Kontaktmöglichkeiten, Gesamtpreis und zusätzliche Kosten,
      Zahlungs-, Liefer- und Leistungsbedingungen, Widerrufsinformationen
      sowie gegebenenfalls Laufzeit, Kündigungsbedingungen und
      Informationen zu digitalen Produkten nach Art. 246a EGBGB.
    - >
      Der Verzicht auf eine Stufe "eindeutig" ist bewusst gewählt, weil
      die Wesentlichkeit einer Information und die rechtliche Bedeutung
      ihrer konkreten Darstellung eine kontextabhängige juristische
      Bewertung erfordern.

  disclaimer_required: true
