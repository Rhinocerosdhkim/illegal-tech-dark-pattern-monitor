# Target profile. Selectors belong here, never in the code.
name: viagogo
industry: Ticketing
start: "https://www.viagogo.de"

# --- C4 (docs/ABSTIMMUNG_Regelwerk.md) ----------------------------------
# Site-wide prerequisites a human has confirmed. With that the applicability
# is ESTABLISHED rather than DERIVED, and "eindeutig" stays possible.
# Product-dependent prerequisites do NOT belong here.
confirmed_by_human:
  is_b2c_offer: true          # checked: DK, 2026-08-20

path:
  - step: startseite
  - step: suchergebnis
    action: search
    value: "Konzert München"
  - step: produktdetail
    action: click_first_result
  - step: warenkorb
    action: click
    selector: "[data-testid=buy]"
